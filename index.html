<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fotovision ERM</title>
<style>
:root{
  --ink:#1a1d23; --paper:#f5f6f8; --paper-dim:#f0f1f4; --card:#ffffff;
  --gold:#e8670a; --gold-dim:#fdf0e8; --gold-dark:#c4560a; --rose:#8B5E4A;
  --green:#1a9e5c; --green-dim:#e5f7ee;
  --red:#d63b3b; --red-dim:#fbe7e7;
  --amber:#e8670a; --amber-dim:#fdf0e8;
  --blue:#1a6fd6; --blue-dim:#e6f0fc;
  --line:#e0e3ea; --muted:#7a8294;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
.font-display{font-weight:800;letter-spacing:-0.01em;}
.font-mono{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{display:none;}
#app{max-width:1100px;margin:0 auto;padding:0 20px 100px;}
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;margin:0 -20px;background:var(--paper-dim);}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 32px 30px;box-shadow:0 12px 32px rgba(26,29,35,.07);}
.login-brand{text-align:center;margin-bottom:30px;}
.login-mark{width:48px;height:48px;border-radius:13px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;letter-spacing:.5px;margin:0 auto 14px;}
.login-brand h1{font-size:19px;font-weight:800;letter-spacing:-.01em;}
.login-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.login-hint{font-size:11.5px;color:var(--muted);margin-top:16px;text-align:center;line-height:1.6;padding-top:16px;border-top:1px solid var(--line);}
.login-version{font-size:11px;color:var(--muted);margin-top:22px;letter-spacing:.4px;}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.05);margin:0 -20px;padding-left:20px;padding-right:20px;}
header.top .brand{display:flex;align-items:center;gap:10px;}
header.top .mark{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px rgba(232,103,10,.4);}
header.top h1{font-size:16px;font-weight:700;letter-spacing:.2px;}
header.top .tag{font-size:10.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
nav.tabs{display:flex;gap:6px;margin:16px 0 22px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
nav.tabs button{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--paper-dim);border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:9px 16px;white-space:nowrap;flex:0 0 auto;}
nav.tabs button.active{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);}
nav.tabs button:hover{color:var(--ink);}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
.grid{display:grid;gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:720px){.grid-3,.grid-2{grid-template-columns:1fr;}}
.stat{padding:16px 18px;}
.stat .num{font-size:30px;font-weight:800;line-height:1;letter-spacing:-0.02em;}
.stat .label{font-size:10.5px;color:var(--muted);margin-top:6px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;}
.stat.alert .num{color:var(--red);}
.stat.ok .num{color:var(--green);}
section.block{margin-bottom:28px;}
section.block > h2{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
section.block > h2 .btn-add{font-size:11px;font-weight:700;color:#fff;background:var(--amber);border:none;border-radius:6px;padding:6px 12px;cursor:pointer;text-transform:none;letter-spacing:0;}
section.block > h2 .btn-add:hover{background:var(--gold-dark);}
.wedding-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:10px;cursor:pointer;transition:border-color .15s;width:100%;text-align:left;font:inherit;color:inherit;}
.wedding-row:hover,.wedding-row:focus{border-color:var(--gold);outline:none;}
.date-chip{font-size:12px;text-align:center;background:var(--paper-dim);border-radius:7px;padding:6px 9px;min-width:52px;line-height:1.2;}
.date-chip .d{font-size:16px;font-weight:600;display:block;}
.wedding-row .info{flex:1;min-width:0;}
.wedding-row .info .client{font-weight:600;font-size:14.5px;}
.wedding-row .info .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.progress-mini{font-size:11.5px;background:var(--paper-dim);padding:4px 8px;border-radius:6px;white-space:nowrap;}
.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.pill.not-started{background:var(--paper-dim);color:var(--muted);}
.pill.in-progress{background:var(--amber-dim);color:var(--amber);}
.pill.done{background:var(--green-dim);color:var(--green);}
.pill.delayed{background:var(--red-dim);color:var(--red);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;}
.overlay.show{display:block;}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--card);
  border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  max-height:86vh;overflow-y:auto;width:100%;max-width:640px;margin:0 auto;
  padding:10px 22px 26px;transform:translateY(100%);transition:transform .22s ease;}
.overlay.show .modal{transform:translateY(0);}
.modal::before{content:'';display:block;width:36px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 14px;}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;}
@media(min-width:640px){.overlay{display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}.overlay:not(.show){display:none;}.modal{position:static;border-radius:12px;transform:none;margin-top:20px;padding:22px;}.modal::before{display:none;}}
.field{margin-bottom:14px;}
.field label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--paper-dim);color:var(--ink);}
.field textarea{resize:vertical;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.staff-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;max-height:180px;overflow-y:auto;padding:2px;}
.person-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:200px;overflow-y:auto;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.12);}
.person-dropdown-item{padding:10px 12px;font-size:13px;cursor:pointer;}
.person-dropdown-item:hover{background:var(--paper-dim);}
.person-dropdown-empty{padding:10px 12px;font-size:12px;color:var(--muted);}
.staff-check{display:flex;align-items:center;gap:8px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px 9px;cursor:pointer;background:var(--paper-dim);}
.staff-check input{width:auto;}
.staff-check.freelancer{border-style:dashed;border-color:var(--blue);}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
.btn{font-weight:700;font-size:14px;padding:11px 18px;border-radius:9px;border:none;cursor:pointer;}
.btn-primary{background:var(--amber);color:#fff;}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--line);}
.btn-sm{padding:6px 11px;font-size:12px;}
.back-link{font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:14px;display:inline-block;}
.back-link:hover{color:var(--ink);}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.event-card{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--card);overflow:hidden;}
.event-card .ehead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none;gap:10px;}
.event-card .ehead-left{display:flex;align-items:center;gap:8px;min-width:0;}
.event-card .echev{font-size:11px;color:var(--muted);transition:transform .15s;flex-shrink:0;}
.event-card .echev.open{transform:rotate(90deg);}
.dm-event-card .echev{transition:transform .15s;flex-shrink:0;}
.dm-event-card .echev.open{transform:rotate(90deg);}
.pending-chip{border-color:var(--red)!important;background:var(--red-dim)!important;}
.event-card .ename{font-weight:700;font-size:13.5px;white-space:nowrap;}
.event-card .edate{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.event-card .ebody{display:none;padding:0 14px 14px;border-top:1px solid var(--line);}
.event-card .ebody.open{display:block;padding-top:10px;}
.team-line{font-size:12.5px;color:var(--ink);margin-top:4px;}
.team-line b{color:var(--muted);font-weight:600;font-size:11px;margin-right:6px;}
.chip{display:inline-block;font-size:11.5px;background:var(--paper-dim);padding:3px 9px;border-radius:20px;margin:2px 3px 2px 0;}
.chip.freelancer{background:var(--blue-dim);color:var(--blue);}
.track-group{margin-bottom:18px;}
.track-group-title{font-size:10.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;}
.stage-row{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.stage-node{display:flex;flex-direction:column;align-items:center;flex:1 1 0;min-width:96px;text-align:center;cursor:pointer;}
.stage-dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:2px solid var(--line);background:var(--card);color:var(--muted);transition:border-color .15s;}
.stage-node.done .stage-dot{background:var(--green);border-color:var(--green);color:#fff;}
.stage-node.active .stage-dot{background:var(--amber);border-color:var(--amber);color:#fff;}
.stage-node.stuck .stage-dot{background:var(--red);border-color:var(--red);color:#fff;}
.stage-node.expanded .stage-dot{box-shadow:0 0 0 3px var(--paper-dim);}
.stage-node:hover .stage-dot{border-color:var(--gold);}
.stage-name{font-size:12px;font-weight:700;margin-top:9px;color:var(--ink);}
.stage-count{font-size:10.5px;color:var(--muted);margin-top:2px;}
.stage-node.stuck .stage-count{color:var(--red);font-weight:600;}
.stage-detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.stage-detail-head h3{font-size:15px;font-weight:800;}
.trackcard{border-radius:8px;padding:8px 12px;margin-bottom:6px;border:1px solid var(--line);background:var(--card);transition:background .15s,border-color .15s;}
.trackcard.is-done{background:var(--green-dim);border-color:var(--green);}
.trackcard.is-not-done,.trackcard.is-delayed{background:var(--red-dim);border-color:var(--red);}
.trackcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px;}
.trackcard-title{font-weight:700;font-size:12.5px;}
.trackcard-title .plat{color:var(--muted);font-weight:500;font-size:11px;}
.trackcard-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:5px;margin-bottom:5px;}
.trackcard-field label{display:block;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;}
.trackcard-field select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:5px;font-size:11px;background:var(--card);}
.trackcard-link{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.trackcard-link input{flex:1;padding:5px 6px;border:1px solid var(--line);border-radius:5px;font-size:11px;background:var(--card);}
.track-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:8px;flex-wrap:wrap;}
.track-row .tname{font-weight:600;font-size:13px;min-width:150px;flex:1;}
.track-row .tmeta{font-size:11px;color:var(--muted);}
.track-row select{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);}
.track-row input[type=date]{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);width:126px;}
.track-row input[type=text]{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);width:150px;}
.track-row a.link-out{font-size:11px;color:var(--blue);font-weight:600;}
.overall-progress{margin:10px 0 24px;}
.bar-track{height:7px;border-radius:5px;background:var(--paper-dim);overflow:hidden;}
.bar-fill{height:100%;background:var(--amber);border-radius:5px;transition:width .2s;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px;}
.dm-event-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--card);}
.dm-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line);}
.dm-row:last-child{border-bottom:none;}
.dm-row-label{width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:var(--muted);text-align:center;gap:2px;padding:8px 0;}
.dm-cells{display:flex;flex-wrap:wrap;flex:1;gap:0;}
.dm-cell{position:relative;flex:1 1 130px;max-width:200px;padding:12px 14px;cursor:pointer;border-right:1px solid rgba(255,255,255,.5);}
.dm-cell.pending{background:var(--red-dim);}
.dm-cell.copied{background:var(--green-dim);}
.dm-name{font-weight:700;font-size:12.5px;color:var(--ink);}
.dm-size{font-size:10.5px;margin-top:4px;color:var(--muted);opacity:.85;}
.dm-size-input{display:none;margin-top:4px;width:90px;font-size:11px;padding:3px 5px;border:1px solid rgba(0,0,0,.2);border-radius:5px;background:rgba(255,255,255,.8);}
.dm-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.15);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:16px;text-align:center;cursor:pointer;}
.dm-add{flex:1 1 100px;max-width:140px;display:flex;align-items:center;justify-content:center;padding:12px 10px;border:1px dashed var(--line);cursor:pointer;text-align:center;font-size:11.5px;color:var(--amber);font-weight:700;}
.fab{position:fixed;bottom:20px;right:18px;z-index:60;background:var(--amber);color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;box-shadow:0 4px 14px rgba(232,103,10,.35);border:none;cursor:pointer;}
.fev-box{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--card);}
.fev-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line);}
.fev-row:first-of-type{border-top:none;margin-top:8px;}
.fev-row select{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);}
.fev-row input[type=text]{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);width:130px;}
.ledger-row{display:flex;align-items:flex-start;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);}
.ledger-date{width:88px;flex-shrink:0;font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap;padding-top:3px;}
.ledger-content{flex:1;font-size:11.5px;line-height:1.3;}
.ledger-content-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ledger-content.muted{color:var(--muted);}
.ledger-row.holiday{background:var(--red-dim);border-radius:6px;padding:6px 4px;}
.ledger-task{display:flex;align-items:center;gap:5px;flex-wrap:wrap;width:100%;margin-bottom:3px;}
.ledger-task .tname{font-size:11.5px;}
.ledger-task select{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:2px 4px;background:var(--paper-dim);}
.ledger-task .btn-sm{padding:2px 7px;font-size:10px;}
.ledger-add{color:var(--amber);font-weight:700;font-size:10.5px;cursor:pointer;white-space:nowrap;}
.ledger-inline-assign{display:flex;align-items:center;gap:4px;flex-wrap:wrap;width:100%;}
.ledger-mini-select{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--paper-dim);flex:1;min-width:100px;}
.ledger-mini-input{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--paper-dim);flex:1;min-width:60px;}

.cal-grid{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);}
.cal-row{display:flex;align-items:flex-start;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);}
.cal-row:last-child{border-bottom:none;}
.cal-row.cal-sunday{background:var(--red-dim);}
.cal-row.cal-today{background:var(--gold-dim);}
.cal-date{width:90px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--muted);padding-top:3px;white-space:nowrap;}
.cal-tasks{flex:1;display:flex;flex-direction:column;gap:5px;}
.cal-empty{font-size:11px;color:var(--line);font-style:italic;}
.cal-task-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--paper-dim);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;font-weight:600;}
.cal-task-chip.delayed{background:var(--red-dim);border-color:var(--red);}
.cal-task-chip.done{background:var(--green-dim);border-color:var(--green);opacity:.7;}
.btn-xs{font-size:10px;padding:2px 7px;border-radius:5px;}
.sched-day.sched-today .sched-date{color:var(--gold);font-weight:800;}
.sched-day.holiday .sched-date{color:var(--red);}
.sched-date{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.sched-tasks{display:flex;flex-direction:column;gap:8px;}
.sched-task{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 14px;}
.sched-task.sched-done{background:var(--green-dim);border-color:var(--green);}
.sched-task.sched-delayed{background:var(--red-dim);border-color:var(--red);}
.sched-task.sched-extra{border-style:dashed;background:var(--gold-dim);}
.sched-task-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sched-task-label{font-weight:600;font-size:13px;flex:1;}
.sched-note{font-size:11.5px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}

/* ── Mobile overrides ── */
@media(max-width:600px){
  #app{padding:0 12px 80px;}
  header.top{margin:0 -12px;padding-left:12px;padding-right:12px;}
  nav.tabs{gap:4px;margin:12px 0 16px;overflow-x:auto;padding-bottom:2px;}
  nav.tabs button{font-size:11.5px;padding:8px 12px;}
  .stat .num{font-size:24px;}

  /* Wedding rows — stack progress info on mobile */
  .wedding-row{flex-wrap:wrap;gap:10px;}
  .progress-mini{font-size:11px;}

  /* Ledger rows — stack date above content on very small screens */
  .ledger-row{flex-direction:column;gap:4px;padding:8px 4px;}
  .ledger-date{width:100%;font-size:11px;}
  .ledger-inline-assign{gap:6px;}
  .ledger-mini-select,.ledger-mini-input{font-size:13px;padding:7px 8px;border-radius:7px;}

  /* Track cards in post-production */
  .trackcard{padding:8px 10px;}
  .trackcard-fields{grid-template-columns:1fr 1fr;}
  .trackcard-field select{font-size:12px;padding:7px 6px;}

  /* Stage beads — smaller on phone */
  .stage-row{gap:8px;}
  .stage-dot{width:38px;height:38px;font-size:12px;}
  .stage-name{font-size:11px;}
  .stage-count{font-size:10px;}

  /* Data management */
  .dm-event-card{padding:10px;}
  .dm-row{flex-direction:column;gap:6px;}
  .dm-cells{flex-wrap:wrap;}
  .dm-cell{min-width:calc(50% - 6px);}

  /* Staff directory */
  .staff-row{flex-wrap:wrap;gap:8px;}

  /* Modal full screen on small phones */
  .modal{max-height:92vh;}

  /* Detail header — stack on mobile */
  .detail-header{flex-direction:column;align-items:flex-start;gap:10px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<datalist id="clientNamesList"></datalist>
<datalist id="peopleNamesList"></datalist>

<script>
// ---------- Sample people data ----------
const APP_VERSION = 'v48';
const OWNER = {id:'owner1', name:'Rahul Gauri', title:'Owner', accountRole:'owner', skills:[], loginId:'admin', password:'admin123'};
const EMPLOYEES = [];
const FREELANCERS = [];
EMPLOYEES.forEach(p=>{ if(p.loginId===undefined) p.loginId=p.name.split(' ')[0].toLowerCase(); if(p.password===undefined) p.password='123'; });
// getAllPeople() is a live lookup, not a frozen snapshot — EMPLOYEES/FREELANCERS get
// repopulated in place after the async Firestore load and whenever staff are added, so a
// one-time [...EMPLOYEES,...FREELANCERS] copy taken here at script-eval time would go stale.
function getAllPeople(){ return [...EMPLOYEES, ...FREELANCERS]; }
const ACCOUNTS = [OWNER, ...EMPLOYEES]; // freelancers have no login
function personName(id){ return id===OWNER.id ? OWNER.name : (getAllPeople().find(p=>p.id===id)?.name || id); }
function isFreelancer(id){ return FREELANCERS.some(p=>p.id===id); }
const ROLE_LABEL = {owner:'Owner', manager:'Manager', staff:'Staff'};
const SKILL_LABEL = {still:'Still Photography', cine:'Cinematography', lightroom:'Lightroom', photoshop:'Photoshop',
  teaser:'Teaser', instacut:'Insta-cut', story:'Wedding Story', reels:'Reels', fullVideo:'Full Video', videoBook:'Video Book'};
const ALL_SKILLS = Object.keys(SKILL_LABEL);
let currentUser = null; // set after login



const STATUS = ['not-started','done'];
const STATUS_LABEL = {'not-started':'Not Done','done':'Done'};
const DATA_STATUS = ['pending','copied'];

// ---------- Track definitions (all wedding-wide now) ----------
// Grouping for Post-Production's 3 stage circles: allPhotos + albumDesign live here but
// are grouped under "Photo Editing" in stageCategories(); photoFrames + videoBook +
// pendrive are grouped under "Delivery Works". albumUpload/printing/delivery/deliveryDone
// were dropped entirely per Rahul's request — no longer tracked anywhere.
const WEDDING_TRACKS = [
  {key:'allPhotos', label:'All Photographs (watermarked, low-res)', platform:'Google Drive'},
  {key:'albumDesign', label:'Album Design', platform:''},
  {key:'photoFrames', label:'Photo Frames', platform:''},
  {key:'videoBook', label:'Video Book', platform:'', skill:'videoBook'},
  {key:'pendrive', label:'Pendrive', platform:''},
];
// Video Editing sub-items (wedding-wide, single assignee each)
const VIDEO_EDITING_SINGLE = [
  {key:'teaser', label:'Teaser', platform:'Vimeo', skill:'teaser'},
  {key:'instacut', label:'Insta-cut', platform:'Vimeo', skill:'instacut'},
  {key:'reels', label:'Reels', platform:'Vimeo', skill:'reels'},
  {key:'story', label:'Wedding Story', platform:'Vimeo', skill:'story'},
];

function newTrackObj(defaultAssignee){
  return {status:'not-started', assignee:defaultAssignee||'', start:'', due:'', link:''};
}
function newPhotoEditingObj(){
  return {
    lightroom: {status:'not-started', assignee:'', start:'', due:'', link:''},
    photoshop: {status:'not-started', assignee:'', start:'', due:''}
  };
}
function newVideoEditingObj(events){
  const fullVideo={};
  events.forEach(ev=> fullVideo[ev.id]=newTrackObj());
  const obj={fullVideo};
  VIDEO_EDITING_SINGLE.forEach(t=> obj[t.key]=newTrackObj());
  return obj;
}
function newDataManagementObj(events){
  return {hardDisks:[], events:{}}; // events[id].still/video = [{pid,status,dataSize}], lazy-initialized from event team
}
function weddingWideTracks(w){
  const obj={};
  WEDDING_TRACKS.forEach(t=> obj[t.key]=newTrackObj());
  return obj;
}

// ---------- Weddings (starts empty) ----------
let WEDDINGS = [];

let currentTab='dashboard';
let currentWeddingId=null;

const TASKS = []; // independent task records — see spec comment below
// Every staff task lives here, regardless of source:
// - Created by owner assigning from Post-Production (linked to a wedding track via ref)
// - Created by owner assigning directly from Assign Work (free-form, no wedding required)
// - Created by staff logging extra work themselves
// Shape: {id, personId, label, client, dueDate, status, note, type, weddingId?, ref?, createdBy, createdAt, isExtra}
let __idCounter=0;
function genTaskId(){ return 'tk'+Date.now().toString(36)+(__idCounter++).toString(36); }
function syncTaskFromTrack(w, trackLabel, track, ref){
  if(!track.assignee) return;
  const existing = TASKS.find(t=>t.weddingId===w.id && t.ref && JSON.stringify(t.ref)===JSON.stringify(ref));
  if(existing){
    existing.personId=track.assignee;
    existing.label=trackLabel;
    existing.client=w.client;
    existing.dueDate=track.due||'';
    existing.status=track.status||'not-started';
  } else {
    const createdBy=(typeof currentUser!=='undefined'&&currentUser)?currentUser.id:'owner1';
    TASKS.push({
      id:genTaskId(), personId:track.assignee, label:trackLabel, client:w.client,
      dueDate:track.due||'', status:track.status||'not-started', note:'', type:'wedding',
      weddingId:w.id, ref, isExtra:false, createdBy, createdAt:new Date().toISOString()
    });
  }
}
// One-time migration: build TASKS from all existing wedding track assignments so staff
// who were assigned work before v45 still see it on their schedule. Safe to call multiple
// times — syncTaskFromTrack is idempotent (updates existing entries rather than duplicating).
function migrateTasksFromWeddings(){
  WEDDINGS.forEach(w=>{
    ensureWeddingTracks(w);
    const pe=w.photoEditing;
    if(pe.lightroom.assignee) syncTaskFromTrack(w,'Lightroom',pe.lightroom,{kind:'photoEditing',trackKey:'lightroom'});
    if(pe.photoshop.assignee) syncTaskFromTrack(w,'Photoshop',pe.photoshop,{kind:'photoEditing',trackKey:'photoshop'});
    VIDEO_EDITING_SINGLE.forEach(t=>{
      const track=w.videoEditing[t.key];
      if(track&&track.assignee) syncTaskFromTrack(w,t.label,track,{kind:'videoEditingSingle',trackKey:t.key});
    });
    w.events.forEach(ev=>{
      const track=w.videoEditing.fullVideo[ev.id];
      if(track&&track.assignee) syncTaskFromTrack(w,ev.name+' Full Video',track,{kind:'fullVideo',eventId:ev.id});
    });
    WEDDING_TRACKS.forEach(t=>{
      const track=w.tracks[t.key];
      if(track&&track.assignee) syncTaskFromTrack(w,t.label,track,{kind:'wedding',trackKey:t.key});
    });
  });
}
function genId(){ return 'w'+Date.now().toString(36)+(__idCounter++).toString(36)+Math.random().toString(36).slice(2,6); }
function genEventId(){ return 'ev'+Date.now().toString(36)+(__idCounter++).toString(36)+Math.random().toString(36).slice(2,6); }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function next30DayOptions(selected){
  let opts = `<option value="">—</option>`;
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<=30;i++){
    const d=new Date(today); d.setDate(d.getDate()+i);
    const iso=d.toISOString().slice(0,10);
    const label=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    opts += `<option value="${iso}" ${selected===iso?'selected':''}>${label}</option>`;
  }
  if(selected && !opts.includes(`value="${selected}"`)){
    opts += `<option value="${selected}" selected>${fmtDate(selected)} (past)</option>`;
  }
  return opts;
}
// Only used by Post-Production "Assign to..." dropdowns (Photo/Video Editing, wedding
// tracks) — freelancers never do this kind of work at Fotovision, only event-day Still/
// Cine coverage via the event team picker, so they're excluded here entirely.
function eligiblePeopleFor(skillKey){
  const staff=EMPLOYEES;
  if(!skillKey) return staff;
  return staff.filter(p=> (p.skills||[]).includes(skillKey));
}
function isDelayedTask(t){
  if(!t.dueDate || t.status==='done') return false;
  return new Date(t.dueDate) < new Date(new Date().toDateString());
}
function isSunday(dateStr){ return dateStr && new Date(dateStr+'T00:00:00').getDay()===0; }
function shiftDateSkippingSunday(dateStr, days){
  if(!dateStr) return dateStr;
  let d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  while(d.getDay()===0){ d.setDate(d.getDate()+1); }
  return d.toISOString().slice(0,10);
}
function dateChip(d){ if(!d) return {day:'—', mon:''}; const dt=new Date(d+'T00:00:00'); return {day:dt.getDate(), mon:dt.toLocaleDateString('en-IN',{month:'short'})}; }
// A wedding has no date of its own — it's just a group of events, each dated separately —
// so anywhere we used to show "the wedding date" now shows its earliest event's date.
function earliestEventDate(w){
  const dates=w.events.map(e=>e.date).filter(Boolean).sort();
  return dates.length ? dates[0] : null;
}

// ---------- progress calc ----------
// Schema safety net: whenever WEDDING_TRACKS gains a key (like "pendrive" in v35) or a
// wedding was saved under an older schema, w.tracks might be missing that key entirely.
// Backfill any missing keys on the fly instead of crashing when something reads them.
function ensureWeddingTracks(w){
  WEDDING_TRACKS.forEach(t=>{ if(!w.tracks[t.key]) w.tracks[t.key]=newTrackObj(); });
}
function allTracksOf(w){
  ensureWeddingTracks(w);
  let list=[];
  WEDDING_TRACKS.forEach(t=> list.push(w.tracks[t.key]));
  list.push(w.photoEditing.lightroom, w.photoEditing.photoshop);
  VIDEO_EDITING_SINGLE.forEach(t=> list.push(w.videoEditing[t.key]));
  w.events.forEach(ev=> list.push(w.videoEditing.fullVideo[ev.id]));
  // Schema safety net: any status value that isn't "done" (e.g. a leftover "in-progress"
  // from before the 2-state migration) normalizes to "not-started" instead of rendering
  // as "undefined" — STATUS_LABEL only knows about the current 2-state system.
  list.forEach(t=>{ if(t.status!=='done') t.status='not-started'; });
  return list;
}
function progressOf(w){
  const list=allTracksOf(w);
  const done=list.filter(t=>t.status==='done').length;
  return {done, total:list.length, pct: list.length? Math.round(done/list.length*100):0};
}
function isDelayed(t){
  if(!t.due || !t.assignee || t.status==='done') return false;
  return new Date(t.due) < new Date(new Date().toDateString());
}

// ---------- Render shell ----------
function render(){
  // Restore saved session from localStorage — so page refresh doesn't log you out
  if(!currentUser){
    try{
      const saved=localStorage.getItem('fverm_loginId');
      if(saved){ const account=findAccountByLogin(saved); if(account){ currentUser=account; currentTab=account.accountRole==='staff'?'mytasks':'dashboard'; } }
    } catch(e){}
  }
  if(!currentUser){ renderLogin(); return; }
  document.getElementById('clientNamesList').innerHTML = WEDDINGS.map(w=>`<option value="${esc(w.client)}">`).join('');
  document.getElementById('peopleNamesList').innerHTML = getAllPeople().map(p=>`<option value="${esc(p.name)}">`).join('');
  const isOwner = currentUser.accountRole==='owner';
  const isManager = currentUser.accountRole==='manager';
  const isStaff = currentUser.accountRole==='staff';
  document.getElementById('app').innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="mark"></div>
        <div><h1>Fotovision ERM</h1><div class="tag">${APP_VERSION} · ${currentUser.name.toUpperCase()} · ${ROLE_LABEL[currentUser.accountRole].toUpperCase()}</div></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Switch User</button>
    </header>
    <nav class="tabs">
      ${isStaff ? tabBtn('mytasks','My Tasks') : ''}
      ${!isStaff ? tabBtn('dashboard','Dashboard') : ''}
      ${(isOwner||isManager) ? tabBtn('assignwork','Assign Work') : ''}
      ${!isStaff ? tabBtn('weddings','Weddings') : ''}
      ${(isOwner||isManager) ? tabBtn('harddisk','Hard Disks') : ''}
      ${isOwner ? tabBtn('settings','Settings') : ''}
    </nav>
    <div id="tabContent"></div>
    ${(!isStaff && currentTab!=='assignwork') ? `<button class="fab" id="fabBtn" onclick="handleFab()">+</button>` : ''}
  `;
  renderTab();
}
function logout(){
  currentUser=null; currentTab='dashboard'; currentWeddingId=null;
  try{ localStorage.removeItem('fverm_loginId'); } catch(e){}
  render();
}
function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <div class="login-brand">
          <div class="login-mark">FV</div>
          <h1>Fotovision ERM</h1>
          <p class="login-sub">Wedding production &amp; delivery tracker</p>
        </div>
        <div class="field"><label>Login ID</label><input id="f_loginId" placeholder="e.g. admin" onkeydown="if(event.key==='Enter')document.getElementById('f_loginPassword').focus()"></div>
        <div class="field"><label>Password</label><input id="f_loginPassword" type="password" onkeydown="if(event.key==='Enter')attemptLogin()"></div>
        <div id="loginError" style="color:var(--red);font-size:12.5px;margin-bottom:8px;"></div>
        <button class="btn btn-primary" style="width:100%;" onclick="attemptLogin()">Sign In</button>
        <div class="login-hint">Owner login: <b>admin</b> / <b>admin123</b><br>Ask your Owner or Manager to add you in Settings if you don't have a login yet.</div>
      </div>
      <div class="login-version">Fotovision ERM · ${APP_VERSION}</div>
    </div>
  `;
}
function findAccountByLogin(loginId){
  loginId=(loginId||'').trim().toLowerCase();
  if(!loginId) return null;
  if(OWNER.loginId && OWNER.loginId.toLowerCase()===loginId) return OWNER;
  return EMPLOYEES.find(p=>p.loginId && p.loginId.toLowerCase()===loginId) || null;
}
function attemptLogin(){
  const loginId=document.getElementById('f_loginId').value.trim();
  const password=document.getElementById('f_loginPassword').value;
  const errEl=document.getElementById('loginError');
  errEl.textContent='';
  if(!loginId||!password){ errEl.textContent='Enter login ID and password.'; return; }
  const account=findAccountByLogin(loginId);
  if(!account || account.password!==password){
    errEl.textContent='Incorrect login ID or password.';
    return;
  }
  currentUser=account;
  currentTab=account.accountRole==='staff' ? 'mytasks' : 'dashboard';
  try{ localStorage.setItem('fverm_loginId', account.loginId); } catch(e){}
  render();
}
function loginAs(id){
  currentUser = id===OWNER.id ? OWNER : EMPLOYEES.find(p=>p.id===id);
  currentTab = currentUser.accountRole==='staff' ? 'mytasks' : 'dashboard';
  try{ localStorage.setItem('fverm_loginId', currentUser.loginId); } catch(e){}
  render();
}
function handleFab(){
  if(currentWeddingId) openEventModal(currentWeddingId);
  else openWeddingModal();
}
function tabBtn(id,label){ return `<button class="${currentTab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`; }
function setTab(id){ currentTab=id; currentWeddingId=null; assignWorkStaffId=null; renderTab(); }
function renderTab(){
  document.getElementById('clientNamesList').innerHTML = WEDDINGS.map(w=>`<option value="${esc(w.client)}">`).join('');
  document.getElementById('peopleNamesList').innerHTML = getAllPeople().map(p=>`<option value="${esc(p.name)}">`).join('');
  const el=document.getElementById('tabContent');
  if(currentTab==='dashboard') el.innerHTML=renderDashboard();
  else if(currentTab==='mytasks') el.innerHTML=renderMyTasks();
  else if(currentTab==='assignwork') el.innerHTML=renderAssignWork();
  else if(currentTab==='harddisk') el.innerHTML=renderHardDiskTab();
  else if(currentTab==='settings') el.innerHTML=renderSettings();
  else el.innerHTML = currentWeddingId ? renderWeddingDetail(currentWeddingId) : renderWeddingsList();
  if(window.fvScheduleSave) window.fvScheduleSave();
}

// ---------- My Tasks / Assign Work (date ledger, shared between staff self-view and owner/manager staff-wise view) ----------
// Escape text before dropping it into HTML/attributes — client names, event names, notes etc. are
// free-text user input and must never be interpolated raw (breaks onclick="" attrs on apostrophes,
// and is a stored-XSS risk otherwise).
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Each item carries a stable `ref` (kind + key, matching getTrackByRef) so callers never have to
// match on the human-readable label string, which can collide (duplicate event names) or contain
// characters (apostrophes, quotes) that break inline onclick="" handlers.
function collectAssignedItems(personId){
  const items=[];
  WEDDINGS.forEach(w=>{
    ensureWeddingTracks(w);
    if(w.photoEditing.lightroom.assignee===personId) items.push({w, label:'Lightroom — Photo Editing', track:w.photoEditing.lightroom, ref:{kind:'photoEditing', trackKey:'lightroom'}});
    if(w.photoEditing.photoshop.assignee===personId) items.push({w, label:'Photoshop — Photo Editing', track:w.photoEditing.photoshop, ref:{kind:'photoEditing', trackKey:'photoshop'}});
    VIDEO_EDITING_SINGLE.forEach(t=>{ if(w.videoEditing[t.key].assignee===personId) items.push({w, label:t.label+' — Video Editing', track:w.videoEditing[t.key], ref:{kind:'videoEditingSingle', trackKey:t.key}}); });
    w.events.forEach(ev=>{ if(w.videoEditing.fullVideo[ev.id].assignee===personId) items.push({w, label:ev.name+' — Full Video', track:w.videoEditing.fullVideo[ev.id], ref:{kind:'fullVideo', eventId:ev.id}}); });
    WEDDING_TRACKS.forEach(t=>{ if(w.tracks[t.key].assignee===personId) items.push({w, label:t.label, track:w.tracks[t.key], ref:{kind:'wedding', trackKey:t.key}}); });
  });
  return items;
}
// Scoped to a single wedding — shifting a delayed task should never silently reschedule a person's
// work on other, unrelated weddings.
function shiftFutureTasks(personId, weddingId, afterDate, days){
  collectAssignedItems(personId).filter(i=>i.w.id===weddingId).forEach(item=>{
    if(item.track.due && item.track.due > afterDate) item.track.due = shiftDateSkippingSunday(item.track.due, days);
    if(item.track.start && item.track.start > afterDate) item.track.start = shiftDateSkippingSunday(item.track.start, days);
  });
}
function promptShiftSchedule(personId, weddingId, refStr){
  const daysStr = prompt("How many days delayed? This shifts this person's other upcoming tasks on this wedding forward by this many days (Sundays are skipped).", '1');
  const days = parseInt(daysStr,10);
  if(!days || days<1) return;
  const ref=JSON.parse(decodeURIComponent(refStr));
  const w=WEDDINGS.find(x=>x.id===weddingId);
  if(!w) return;
  const track=getTrackByRef(w, ref);
  if(!track) return;
  const afterDate = track.due || new Date().toISOString().slice(0,10);
  shiftFutureTasks(personId, weddingId, afterDate, days);
  renderTab();
}
function renderMyTasks(){ return renderScheduleFor(currentUser.id); }
function renderScheduleFor(personId){
  const myTasks=TASKS.filter(t=>t.personId===personId).sort((a,b)=>(a.dueDate||'9999')>(b.dueDate||'9999')?1:-1);
  const isMe = currentUser && currentUser.id===personId;
  const person=EMPLOYEES.find(x=>x.id===personId)||OWNER;
  const today=new Date().toISOString().slice(0,10);

  if(!myTasks.length) return `<section class="block"><h2>Schedule</h2>${emptyState('No tasks assigned yet.')}</section>`;

  // Group by date
  const byDate={};
  myTasks.forEach(t=>{
    const key=t.dueDate||'no-date';
    if(!byDate[key]) byDate[key]=[];
    byDate[key].push(t);
  });

  const dates=Object.keys(byDate).sort();
  let html='';
  dates.forEach(dateKey=>{
    const tasks=byDate[dateKey];
    const label=dateKey==='no-date'?'No due date':fmtDate(dateKey);
    const isToday=dateKey===today;
    const isPast=dateKey<today && dateKey!=='no-date';
    const sunday=dateKey!=='no-date' && new Date(dateKey+'T00:00:00').getDay()===0;
    html+=`<div class="sched-day${isToday?' sched-today':''}${sunday?' holiday':''}">
      <div class="sched-date">${label}${isToday?' · Today':''}</div>
      <div class="sched-tasks">
        ${tasks.map(t=>{
          const delayed=isDelayedTask(t);
          const cls=t.status==='done'?'done':(delayed?'delayed':'not-started');
          return `<div class="sched-task${t.isExtra?' sched-extra':''}${t.status==='done'?' sched-done':''}${delayed?' sched-delayed':''}">
            <div class="sched-task-top">
              <span class="pill ${cls}">${t.status==='done'?'Done':(delayed?'Delayed':'Not Done')}</span>
              <span class="sched-task-label">${esc(t.label)}${t.client?` <span class="tmeta">— ${esc(t.client)}</span>`:''}${t.isExtra?` <span class="tmeta">(extra)</span>`:''}</span>
              ${isMe?`<button class="btn btn-sm ${t.status==='done'?'btn-ghost':'btn-primary'}" onclick="toggleTaskDone('${t.id}')">${t.status==='done'?'↩ Undo':'✓ Done'}</button>`:''}
            </div>
            ${t.note?`<div class="sched-note">📝 ${esc(t.note)}</div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });

  const extraWip = isMe ? `
    <div class="card" style="margin-top:20px;">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">+ Log Extra Work Done Today</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <input id="extra_client" placeholder="Client name (optional)" style="padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-dim);">
        <input id="extra_label" placeholder="What did you do? e.g. Extra photo corrections" style="padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-dim);">
        <input id="extra_note" placeholder="Any notes for owner (optional)" style="padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-dim);">
        <button class="btn btn-primary" onclick="logExtraWork('${personId}')">Log This Work</button>
      </div>
    </div>
  ` : '';

  return `<section class="block"><h2>Schedule — ${esc(person.name)}</h2>${html}${extraWip}</section>`;
}
function toggleTaskDone(taskId){
  const t=TASKS.find(x=>x.id===taskId);
  if(!t) return;
  t.status = t.status==='done' ? 'not-started' : 'done';
  // Also sync back to the wedding track if this task is linked to one
  if(t.weddingId && t.ref){
    const w=WEDDINGS.find(x=>x.id===t.weddingId);
    if(w){ const track=getTrackByRef(w,t.ref); if(track) track.status=t.status; }
  }
  renderTab();
}
function logExtraWork(personId){
  const client=document.getElementById('extra_client').value.trim();
  const label=document.getElementById('extra_label').value.trim();
  const note=document.getElementById('extra_note').value.trim();
  if(!label){ alert('Please describe what you did.'); return; }
  // Use local date (not UTC ISO) so midnight-timezone issues don't show yesterday's date
  const now=new Date();
  const localDate=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  TASKS.push({
    id:genTaskId(), personId, label, client, dueDate:localDate,
    status:'done', note, type:'extra', isExtra:true,
    createdBy:personId, createdAt:now.toISOString()
  });
  renderTab();
}
// ---------- Assign Work tab (owner/manager) ----------
let assignWorkStaffId=null;
function openAssignWorkStaff(id){ assignWorkStaffId=id; renderTab(); }
function closeAssignWorkStaff(){ assignWorkStaffId=null; renderTab(); }

// Build label dropdown options from staff's tagged skills + any custom work types
function skillOptions(person){
  const skills=(person&&person.skills)||[];
  const opts=skills.map(s=>SKILL_LABEL[s]).filter(Boolean);
  // Also add delivery/wedding-wide work types that don't require a specific skill tag
  const extras=['All Photographs','Album Design','Photo Frames','Video Book','Pendrive','Full Event Video'];
  extras.forEach(e=>{ if(!opts.includes(e)) opts.push(e); });
  return opts;
}

function renderAssignWork(){
  if(assignWorkStaffId){
    const p=EMPLOYEES.find(x=>x.id===assignWorkStaffId)||OWNER;
    const allTasks=TASKS.filter(t=>t.personId===assignWorkStaffId && !t.isExtra)
      .sort((a,b)=>(a.dueDate||'9999')>(b.dueDate||'9999')?1:-1);
    const extraTasks=TASKS.filter(t=>t.personId===assignWorkStaffId && t.isExtra);
    const skillOpts=skillOptions(p);

    // Build 30-day rolling calendar
    const today=new Date(); today.setHours(0,0,0,0);
    const days=[];
    for(let i=0;i<30;i++){
      const d=new Date(today); d.setDate(today.getDate()+i);
      days.push(d.toISOString().slice(0,10));
    }

    const calRows=days.map(iso=>{
      const dayTasks=allTasks.filter(t=>t.dueDate===iso);
      const sunday=new Date(iso+'T00:00:00').getDay()===0;
      const isToday=iso===days[0];
      const dateLabel=new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'});
      return `
        <div class="cal-row${sunday?' cal-sunday':''}${isToday?' cal-today':''}">
          <div class="cal-date">${dateLabel}${isToday?' · Today':''}</div>
          <div class="cal-tasks">
            ${dayTasks.length
              ? dayTasks.map(t=>`
                <div class="cal-task-chip${isDelayedTask(t)?' delayed':''}${t.status==='done'?' done':''}">
                  <span>${esc(t.label)}${t.client?` — ${esc(t.client)}`:''}</span>
                  <span style="display:flex;gap:5px;align-items:center;">
                    <button class="btn btn-ghost btn-xs" onclick="openEditTaskModal('${t.id}')">Edit</button>
                    <button class="btn btn-ghost btn-xs" onclick="duplicateTask('${t.id}')">Dup</button>
                    <button class="btn btn-ghost btn-xs" style="color:var(--red);" onclick="removeTask('${t.id}')">✕</button>
                  </span>
                </div>`)
              .join('')
              : `<span class="cal-empty">Free</span>`}
          </div>
        </div>`;
    }).join('');

    return `
      <span class="back-link" onclick="closeAssignWorkStaff()">&larr; back to staff list</span>
      <h2 class="font-display" style="font-size:20px;margin-bottom:20px;">${esc(p.name)} <span style="color:var(--muted);font-weight:500;font-size:14px;">— ${esc(p.title)}</span></h2>

      <div class="card" style="margin-bottom:20px;">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">+ Assign New Task</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="position:relative;">
            <input id="aw_label" placeholder="What to do..." autocomplete="off"
              style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-dim);"
              oninput="renderAwLabelDropdown()" onfocus="renderAwLabelDropdown()"
              onblur="setTimeout(()=>{const d=document.getElementById('awLabelDropdown');if(d)d.style.display='none';},150)">
            <div id="awLabelDropdown" class="person-dropdown">
              ${skillOpts.map(o=>`<div class="person-dropdown-item" onmousedown="event.preventDefault();document.getElementById('aw_label').value='${esc(o)}';document.getElementById('awLabelDropdown').style.display='none';">${esc(o)}</div>`).join('')}
            </div>
          </div>
          <div style="position:relative;">
            <input id="aw_client" placeholder="Client name (optional)" autocomplete="off"
              style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-dim);"
              oninput="renderAwClientDropdown()" onfocus="renderAwClientDropdown()"
              onblur="setTimeout(()=>{const d=document.getElementById('awClientDropdown');if(d)d.style.display='none';},150)">
            <div id="awClientDropdown" class="person-dropdown"></div>
          </div>
          <input id="aw_due" type="date" style="padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-dim);">
          <input id="aw_note" placeholder="Note for staff (optional)" style="padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-dim);">
          <button class="btn btn-primary" onclick="submitDirectAssign('${assignWorkStaffId}')">Assign Task</button>
        </div>
      </div>

      <section class="block" style="padding:0;margin-bottom:24px;">
        <h2 style="margin-bottom:10px;">Next 30 Days <span style="color:var(--muted);font-weight:400;font-size:13px;">${allTasks.filter(t=>t.status!=='done').length} pending</span></h2>
        <div class="cal-grid">${calRows}</div>
      </section>

      ${extraTasks.length ? `
        <section class="block" style="padding:0;margin-top:20px;">
          <h2 style="margin-bottom:14px;">Extra Work Logged by ${esc(p.name)} 📋</h2>
          ${extraTasks.map(t=>`
            <div class="sched-task sched-extra">
              <div class="sched-task-top">
                <span class="pill done">Done</span>
                <span class="sched-task-label">${esc(t.label)}${t.client?` <span class="tmeta">— ${esc(t.client)}</span>`:''} <span class="tmeta">(${fmtDate(t.dueDate)})</span></span>
              </div>
              ${t.note?`<div class="sched-note">📝 ${esc(t.note)}</div>`:''}
            </div>
          `).join('')}
        </section>
      ` : ''}
    `;
  }
  return `
    <section class="block">
      <h2>Assign Work — Pick a Staff Member</h2>
      ${EMPLOYEES.map(p=>{
        const pending=TASKS.filter(t=>t.personId===p.id && !t.isExtra && t.status!=='done').length;
        const extra=TASKS.filter(t=>t.personId===p.id && t.isExtra).length;
        return `
        <button class="wedding-row" onclick="openAssignWorkStaff('${p.id}')">
          <div class="info">
            <div class="client">${esc(p.name)}</div>
            <div class="meta">${esc(p.title)} · ${(p.skills||[]).map(s=>SKILL_LABEL[s]).join(', ')||'no skills tagged'}</div>
          </div>
          <div style="text-align:right;">
            <span class="progress-mini">${pending} pending</span>
            ${extra?`<div style="font-size:10.5px;color:var(--amber);font-weight:700;margin-top:2px;">${extra} extra logged</div>`:''}
          </div>
        </button>`;
      }).join('')}
    </section>
  `;
}

function duplicateTask(taskId){
  const t=TASKS.find(x=>x.id===taskId);
  if(!t) return;
  let nextDate='';
  if(t.dueDate){
    // Use local date arithmetic to avoid UTC timezone shifting the date
    const parts=t.dueDate.split('-').map(Number);
    const d=new Date(parts[0],parts[1]-1,parts[2]+1);
    nextDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  TASKS.push({
    id:genTaskId(), personId:t.personId, label:t.label, client:t.client,
    dueDate:nextDate, status:'not-started', note:t.note||'', type:'direct',
    isExtra:false, createdBy:(currentUser?currentUser.id:'owner1'), createdAt:new Date().toISOString()
  });
  renderTab();
}

function saveEditTask(taskId){
  const t=TASKS.find(x=>x.id===taskId);
  if(!t) return;
  t.label=document.getElementById('et_label').value.trim()||t.label;
  t.client=document.getElementById('et_client').value.trim();
  t.dueDate=document.getElementById('et_due').value;
  t.note=document.getElementById('et_note').value.trim();
  // sync back to wedding track if linked
  if(t.weddingId && t.ref){
    const w=WEDDINGS.find(x=>x.id===t.weddingId);
    if(w){ const track=getTrackByRef(w,t.ref); if(track){ track.due=t.dueDate; } }
  }
  closeModal();
  renderTab();
}
function submitDirectAssign(personId){
  const label=document.getElementById('aw_label').value.trim();
  const client=document.getElementById('aw_client').value.trim();
  const due=document.getElementById('aw_due').value;
  const note=document.getElementById('aw_note').value.trim();
  if(!label){ alert('Please describe what work to do.'); return; }
  TASKS.push({
    id:genTaskId(), personId, label, client, dueDate:due||'',
    status:'not-started', note, type:'direct', isExtra:false,
    createdBy:currentUser?currentUser.id:'owner1', createdAt:new Date().toISOString()
  });
  renderTab();
}
function updateTaskField(taskId, field, value){
  const t=TASKS.find(x=>x.id===taskId);
  if(!t) return;
  t[field]=value;
  // sync back to wedding track if linked
  if(t.weddingId && t.ref){
    const w=WEDDINGS.find(x=>x.id===t.weddingId);
    if(w){ const track=getTrackByRef(w,t.ref); if(track) track[field]=value; }
  }
  fvScheduleSave();
}
function reassignTask(taskId, newPersonId){
  if(!newPersonId) return;
  const t=TASKS.find(x=>x.id===taskId);
  if(!t) return;
  t.personId=newPersonId;
  if(t.weddingId && t.ref){
    const w=WEDDINGS.find(x=>x.id===t.weddingId);
    if(w){ const track=getTrackByRef(w,t.ref); if(track) track.assignee=newPersonId; }
  }
  renderTab();
}
function removeTask(taskId){
  const idx=TASKS.findIndex(x=>x.id===taskId);
  if(idx>-1) TASKS.splice(idx,1);
  renderTab();
}

// ---------- Settings (owner only): staff directory ----------
function assignTrackForPerson(weddingId, dutyValue, eventId, personId, start, due, link, status, notes){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  let t=null; let ref=null; let label='';
  if(dutyValue==='photoEditing:lightroom'||dutyValue==='photoEditing:photoshop'){
    const subKey=dutyValue.split(':')[1];
    t=w.photoEditing[subKey]; ref={kind:'photoEditing',trackKey:subKey}; label=subKey==='lightroom'?'Lightroom':'Photoshop';
  } else if(dutyValue==='fullVideo'){
    t=w.videoEditing.fullVideo[eventId]; ref={kind:'fullVideo',eventId}; label='Full Event Video';
  } else if(dutyValue.startsWith('videoEditingSingle:')){
    const key=dutyValue.split(':')[1]; const def=VIDEO_EDITING_SINGLE.find(x=>x.key===key);
    t=w.videoEditing[key]; ref={kind:'videoEditingSingle',trackKey:key}; label=def?def.label:key;
  } else if(dutyValue.startsWith('wedding:')){
    const key=dutyValue.split(':')[1]; const def=WEDDING_TRACKS.find(x=>x.key===key);
    t=w.tracks[key]; ref={kind:'wedding',trackKey:key}; label=def?def.label:key;
  }
  if(!t) return false;
  t.assignee=personId;
  if(start) t.start=start;
  if(due) t.due=due;
  if(link) t.link=link;
  if(status) t.status=status;
  if(notes) t.notes=notes;
  if(ref) syncTaskFromTrack(w, label, t, ref);
  return true;
}

// ---------- Hard Disk tab ----------
// Shows all known disks. Selecting one from the dropdown (or searching by name) reveals
// which weddings and events have that disk assigned, and the copy status per person.
let hdSelectedDisk = null;
function setHdDisk(name){ hdSelectedDisk=name; renderTab(); }

function renderHardDiskTab(){
  // Collect all disks mentioned anywhere — from KNOWN_DISKS + all current wedding DM
  const allDisks=[...new Set([
    ...KNOWN_DISKS,
    ...WEDDINGS.flatMap(w=>w.dataManagement.hardDisks||[])
  ])].sort();

  // Build disk → [{wedding, event, cat, entries}] index
  function diskIndex(diskName){
    const hits=[];
    WEDDINGS.forEach(w=>{
      if(!(w.dataManagement.hardDisks||[]).includes(diskName)) return;
      w.events.forEach(ev=>{
        ensureDmInit(w,ev);
        const dm=w.dataManagement.events[ev.id];
        const stillEntries=dm.still||[];
        const videoEntries=dm.video||[];
        if(stillEntries.length||videoEntries.length){
          hits.push({w, ev, stillEntries, videoEntries});
        }
      });
    });
    return hits;
  }

  const selected = hdSelectedDisk && allDisks.includes(hdSelectedDisk) ? hdSelectedDisk : null;
  const hits = selected ? diskIndex(selected) : [];

  return `
    <section class="block">
      <h2>Hard Disks</h2>

      <div style="position:relative;max-width:420px;margin-bottom:24px;">
        <input id="hdSearchInput" placeholder="Search or select a disk..." autocomplete="off"
          value="${selected ? esc(selected) : ''}"
          style="width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--card);"
          oninput="renderHdDropdown()"
          onfocus="renderHdDropdown()"
          onblur="setTimeout(()=>{const d=document.getElementById('hdDropdown');if(d)d.style.display='none';},150)">
        <div id="hdDropdown" class="person-dropdown"></div>
      </div>

      ${!selected ? `
        <div style="margin-top:8px;">
          ${allDisks.length ? `
            <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">${allDisks.length} disk${allDisks.length===1?'':'s'} in registry — click one to see which weddings and events it holds</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              ${allDisks.map(d=>`<span class="chip" style="cursor:pointer;font-size:13px;" onclick="setHdDisk('${esc(d)}')">💾 ${esc(d)}</span>`).join('')}
            </div>
          ` : emptyState('No disks added yet. Add disks in a wedding\'s Data Management section.')}
        </div>
      ` : `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
          <span style="font-size:20px;font-weight:800;">💾 ${esc(selected)}</span>
          <button class="btn btn-ghost btn-sm" onclick="setHdDisk(null)">← All Disks</button>
        </div>

        ${hits.length === 0 ? `
          <div class="card" style="color:var(--muted);font-size:13px;padding:20px;">
            This disk is in the registry but hasn't been assigned to any specific event yet.
            Assign it to a wedding in Data Management to see its contents here.
          </div>
        ` : hits.map(({w, ev, stillEntries, videoEntries})=>`
          <div class="card" style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <div>
                <div style="font-weight:700;font-size:14px;">${esc(w.client)}</div>
                <div style="font-size:12px;color:var(--muted);">${fmtDate(ev.date)} — ${esc(ev.name)}</div>
              </div>
              <button class="btn btn-ghost btn-sm" onclick="openWeddingDetail('${w.id}');setTab('weddings')">Open Wedding</button>
            </div>
            ${stillEntries.length ? `
              <div style="margin-bottom:10px;">
                <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">📷 Still</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;">
                  ${stillEntries.map(e=>`
                    <span class="chip ${e.status==='copied'?'':'pending-chip'}">
                      ${esc(personName(e.pid))}
                      ${e.dataSize?`<span style="color:var(--muted);font-size:10.5px;"> · ${esc(e.dataSize)}</span>`:''}
                      <span class="pill ${e.status==='copied'?'done':'not-started'}" style="margin-left:4px;font-size:9px;">${e.status==='copied'?'Copied':'Pending'}</span>
                    </span>
                  `).join('')}
                </div>
              </div>
            ` : ''}
            ${videoEntries.length ? `
              <div>
                <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">🎬 Video</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;">
                  ${videoEntries.map(e=>`
                    <span class="chip ${e.status==='copied'?'':'pending-chip'}">
                      ${esc(personName(e.pid))}
                      ${e.dataSize?`<span style="color:var(--muted);font-size:10.5px;"> · ${esc(e.dataSize)}</span>`:''}
                      <span class="pill ${e.status==='copied'?'done':'not-started'}" style="margin-left:4px;font-size:9px;">${e.status==='copied'?'Copied':'Pending'}</span>
                    </span>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `).join('')}
      `}
    </section>
  `;
}

function saveStaff(personId, jumpToWork){
  const name=document.getElementById('f_stName').value.trim();
  const title=document.getElementById('f_stTitle').value.trim();
  const accountRole=document.getElementById('f_stRole').value;
  const skills=[...document.querySelectorAll('.skillbox:checked')].map(c=>c.value);
  const loginId=document.getElementById('f_stLoginId').value.trim();
  const password=document.getElementById('f_stPassword').value;
  const errEl=document.getElementById('staffModalError');
  if(!name){ alert('Name is required'); return; }
  if(!loginId||!password){ errEl.textContent='Login ID and password are required.'; return; }
  const clash=EMPLOYEES.find(x=>x.id!==personId && x.loginId.toLowerCase()===loginId.toLowerCase());
  if(clash || (OWNER.loginId||'').toLowerCase()===loginId.toLowerCase()){ errEl.textContent='That login ID is already taken.'; return; }

  let newId=personId;
  if(personId){
    const p=EMPLOYEES.find(x=>x.id===personId);
    p.name=name; p.title=title; p.accountRole=accountRole; p.skills=skills; p.loginId=loginId; p.password=password;
  } else {
    newId='e'+Math.random().toString(36).slice(2,9);
    EMPLOYEES.push({id:newId, name, title, type:'inhouse', accountRole, skills, loginId, password});
  }
  closeModal();
  if(jumpToWork){ assignWorkStaffId=newId; }
  renderTab();
}
function saveOwnerAccount(){
  const loginId=document.getElementById('f_ownerLoginId').value.trim();
  const password=document.getElementById('f_ownerPassword').value;
  if(!loginId||!password){ alert('Login ID and password are required.'); return; }
  OWNER.loginId=loginId; OWNER.password=password;
  renderTab();
}
function deleteStaff(personId){
  const idx=EMPLOYEES.findIndex(x=>x.id===personId);
  if(idx>-1) EMPLOYEES.splice(idx,1);
  closeModal();
  renderTab();
}

// ---------- Post-Production as parallel stages (Option E) — no connecting lines/sequence
// implied, since Photo Editing / Video Editing / Delivery Works all run at the same time
// at Fotovision, not one after another. Each bead is its own independent status; clicking
// one expands its tasks below.
const PHOTO_EDIT_WEDDING_KEYS=['allPhotos','albumDesign'];
const DELIVERY_WORKS_KEYS=['photoFrames','videoBook','pendrive'];
function stageCategories(w){
  const photoTracks=[w.photoEditing.lightroom, w.photoEditing.photoshop, ...PHOTO_EDIT_WEDDING_KEYS.map(k=>w.tracks[k])];
  const videoTracks=[...VIDEO_EDITING_SINGLE.map(t=>w.videoEditing[t.key]), ...w.events.map(ev=>w.videoEditing.fullVideo[ev.id])];
  const deliveryTracks=DELIVERY_WORKS_KEYS.map(k=>w.tracks[k]);
  function summarize(list){
    return {done:list.filter(t=>t.status==='done').length, total:list.length, stuck:list.some(isDelayed)};
  }
  return [
    {key:'photoEditing', label:'Photo Edit', ...summarize(photoTracks)},
    {key:'videoEditing', label:'Video Edit', ...summarize(videoTracks)},
    {key:'deliveryWorks', label:'Delivery Works', ...summarize(deliveryTracks)},
  ];
}
let expandedStage=null;
function setExpandedStage(key){ expandedStage = (expandedStage===key ? null : key); renderTab(); }
function renderStageRow(w){
  const stages=stageCategories(w);
  if(expandedStage===null) expandedStage = (stages.find(s=>s.stuck) || stages.find(s=>s.done<s.total) || stages[0]).key;
  return `
    <div class="stage-row">
      ${stages.map(s=>{
        const cls = s.stuck ? 'stuck' : (s.done===s.total && s.total>0) ? 'done' : (s.done>0 ? 'active' : '');
        const dotContent = s.stuck ? (s.total-s.done) : (s.done===s.total && s.total>0) ? '&#10003;' : (s.total-s.done);
        const countText = s.stuck ? `${s.total-s.done} delayed` : (s.done===s.total && s.total>0) ? 'done' : (s.done>0? `${s.done}/${s.total} done` : 'not started');
        return `
        <div class="stage-node ${cls}${expandedStage===s.key?' expanded':''}" onclick="setExpandedStage('${s.key}')">
          <div class="stage-dot">${dotContent}</div>
          <div class="stage-name">${s.label}</div>
          <div class="stage-count">${countText}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}
function renderStageDetail(w){
  const stages=stageCategories(w);
  const current = stages.find(s=>s.key===expandedStage) || stages[0];
  let body='';
  if(current.key==='photoEditing'){
    const allPhotosTrack = WEDDING_TRACKS.find(t=>t.key==='allPhotos');
    const albumDesignTrack = WEDDING_TRACKS.find(t=>t.key==='albumDesign');
    body = renderTrackRow(w.id, allPhotosTrack, w.tracks.allPhotos, {kind:'wedding', trackKey:'allPhotos'})
      + renderPhotoEditingRow(w, 'lightroom', 'Lightroom', false)
      + renderPhotoEditingRow(w, 'photoshop', 'Photoshop', true)
      + renderTrackRow(w.id, albumDesignTrack, w.tracks.albumDesign, {kind:'wedding', trackKey:'albumDesign'});
  } else if(current.key==='videoEditing'){
    body = VIDEO_EDITING_SINGLE.map(t=>renderTrackRow(w.id, t, w.videoEditing[t.key], {kind:'videoEditingSingle', trackKey:t.key})).join('') + renderFullVideoBox(w);
  } else {
    body = WEDDING_TRACKS.filter(t=>DELIVERY_WORKS_KEYS.includes(t.key)).map(t=>renderTrackRow(w.id, t, w.tracks[t.key], {kind:'wedding', trackKey:t.key})).join('');
  }
  return `
    <div class="card stage-detail">
      <div class="stage-detail-head">
        <h3>${current.label}</h3>
        ${current.stuck?`<span class="pill delayed">${current.total-current.done} Delayed</span>`:''}
      </div>
      ${body}
    </div>
  `;
}

// ---------- Shared "Option A" track card shell ----------
// Whole card is green when Done, red when Not Done (Delayed is a red card too, but keeps
// its own "Delayed" badge text so that signal isn't lost). Fields run Assigned To / Start
// / Due / Status, with Status anchored on the far right per Rahul's spec.
function trackCard(title, subtitle, track, delayed, fieldsHtml, linkHtml){
  const cls = delayed ? 'is-delayed' : (track.status==='done' ? 'is-done' : 'is-not-done');
  const badgeText = delayed ? 'Delayed' : STATUS_LABEL[track.status];
  const badgeCls = delayed ? 'delayed' : track.status;
  return `
    <div class="trackcard ${cls}">
      <div class="trackcard-top">
        <div class="trackcard-title">${title}${subtitle?` <span class="plat">${subtitle}</span>`:''}</div>
        <span class="pill ${badgeCls}">${badgeText}</span>
      </div>
      <div class="trackcard-fields">${fieldsHtml}</div>
      ${linkHtml||''}
    </div>
  `;
}
function trackField(labelText, innerHtml){
  return `<div class="trackcard-field"><label>${labelText}</label>${innerHtml}</div>`;
}

// ---------- Photo Editing (All Photographs -> Lightroom -> Photoshop -> Album Design) ----------
function renderPhotoEditingRow(w, subKey, label, hasLink){
  const track = w.photoEditing[subKey];
  const delayed = isDelayed(track);
  const assigneeField = trackField('Assigned To', `
    <select onchange="updatePhotoEditing('${w.id}','${subKey}','assignee',this.value)">
      <option value="">Assign to...</option>
      ${eligiblePeopleFor(subKey).map(p=>`<option value="${p.id}" ${track.assignee===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
    </select>
  `);
  const startField = trackField('Start', `<select onchange="updatePhotoEditing('${w.id}','${subKey}','start',this.value)">${next30DayOptions(track.start)}</select>`);
  const dueField = trackField('Due', `<select onchange="updatePhotoEditing('${w.id}','${subKey}','due',this.value)">${next30DayOptions(track.due)}</select>`);
  const statusField = trackField('Status', `
    <select onchange="updatePhotoEditing('${w.id}','${subKey}','status',this.value)">
      ${STATUS.map(s=>`<option value="${s}" ${track.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
    </select>
  `);
  const linkHtml = hasLink ? `
    <div class="trackcard-link">🔗 <input type="text" placeholder="paste FotoOwl link" value="${esc(track.link)}" onchange="updatePhotoEditing('${w.id}','${subKey}','link',this.value)">
    ${track.link ? `<a class="link-out" href="${esc(track.link)}" target="_blank" rel="noopener">open ↗</a>` : ''}</div>
  ` : '';
  return trackCard(label, hasLink?'(FotoOwl)':'', track, delayed, assigneeField+startField+dueField+statusField, linkHtml);
}
function updatePhotoEditing(weddingId, subKey, field, value){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.photoEditing[subKey][field]=value;
  const label=subKey==='lightroom'?'Lightroom':'Photoshop';
  syncTaskFromTrack(w, label, w.photoEditing[subKey], {kind:'photoEditing',trackKey:subKey});
  renderTab();
}

  const startField = trackField('Start', `<select onchange="updateTrack('${weddingId}','${refStr}','start',this.value)">${next30DayOptions(track.start)}</select>`);
  const dueField = trackField('Due', `<select onchange="updateTrack('${weddingId}','${refStr}','due',this.value)">${next30DayOptions(track.due)}</select>`);
  const statusField = trackField('Status', `
    <select onchange="updateTrack('${weddingId}','${refStr}','status',this.value)">
      ${STATUS.map(s=>`<option value="${s}" ${track.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}

// ---------- Full Event Video: one box, all events listed inside ----------
function renderFullVideoBox(w){
  if(!w.events.length) return emptyState('Add events first');
  return `

      <div class="track-group-title" style="margin-bottom:10px;">Full Event Video <span class="tmeta">(Google Drive)</span></div>
      ${w.events.map(ev=>{
        const track=w.videoEditing.fullVideo[ev.id];
        const delayed=isDelayed(track);
        const ref=encodeURIComponent(JSON.stringify({kind:'fullVideo', eventId:ev.id}));
        const assigneeField = trackField('Assigned To', `
          <select onchange="updateTrack('${w.id}','${ref}','assignee',this.value)">
            <option value="">Assign to...</option>
            ${eligiblePeopleFor('fullVideo').map(p=>`<option value="${p.id}" ${track.assignee===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}

        `);
        const startField = trackField('Start', `<select onchange="updateTrack('${w.id}','${ref}','start',this.value)">${next30DayOptions(track.start)}</select>`);
        const dueField = trackField('Due', `<select onchange="updateTrack('${w.id}','${ref}','due',this.value)">${next30DayOptions(track.due)}</select>`);
        const renderField = trackField('Render Status', `
          <select onchange="updateTrack('${w.id}','${ref}','renderStatus',this.value)">
            <option value="">Render status...</option>
            <option value="rendering" ${track.renderStatus==='rendering'?'selected':''}>In Rendering</option>
            <option value="rendered" ${track.renderStatus==='rendered'?'selected':''}>Video Rendered</option>

        `);

          <select onchange="updateTrack('${w.id}','${ref}','status',this.value)">
            ${STATUS.map(s=>`<option value="${s}" ${track.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}

        return trackCard(esc(ev.name), '', track, delayed, assigneeField+startField+dueField+renderField+statusField, linkHtml);
      }).join('')}
    </div>
  `;

function getTrackByRef(w, ref){
  if(ref.kind==='wedding') return w.tracks[ref.trackKey];
  if(ref.kind==='videoEditingSingle') return w.videoEditing[ref.trackKey];
  if(ref.kind==='fullVideo') return w.videoEditing.fullVideo[ref.eventId];
  if(ref.kind==='photoEditing') return w.photoEditing[ref.trackKey];
}
function updateTrack(weddingId, refStr, field, value){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  if(!w) return;
  const ref=JSON.parse(decodeURIComponent(refStr));
  const track=getTrackByRef(w, ref);
  track[field]=value;
  // Find label for this ref
  let label='';
  if(ref.kind==='videoEditingSingle'){ const d=VIDEO_EDITING_SINGLE.find(t=>t.key===ref.trackKey); label=d?d.label:ref.trackKey; }
  else if(ref.kind==='wedding'){ const d=WEDDING_TRACKS.find(t=>t.key===ref.trackKey); label=d?d.label:ref.trackKey; }
  else if(ref.kind==='fullVideo'){ const ev=w.events.find(e=>e.id===ref.eventId); label=ev?ev.name+' Full Video':'Full Video'; }
  syncTaskFromTrack(w, label, track, ref);
  renderTab();
}
