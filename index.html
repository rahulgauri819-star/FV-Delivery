<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fotovision ERM</title>
<style>
:root{
  --ink:#1a1d23; --paper:#f5f6f8; --paper-dim:#f0f1f4; --card:#ffffff;
  --gold:#e8670a; --gold-dim:#fdf0e8; --gold-dark:#c4560a; --rose:#8B5E4A;
  --green:#1a9e5c; --green-dim:#e5f7ee;
  --red:#d63b3b; --red-dim:#fbe7e7;
  --amber:#e8670a; --amber-dim:#fdf0e8;
  --blue:#1a6fd6; --blue-dim:#e6f0fc;
  --line:#e0e3ea; --muted:#7a8294;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
.font-display{font-weight:800;letter-spacing:-0.01em;}
.font-mono{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{display:none;}
#app{max-width:1100px;margin:0 auto;padding:0 20px 100px;}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.05);margin:0 -20px;padding-left:20px;padding-right:20px;}
header.top .brand{display:flex;align-items:center;gap:10px;}
header.top .mark{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px rgba(232,103,10,.4);}
header.top h1{font-size:16px;font-weight:700;letter-spacing:.2px;}
header.top .tag{font-size:10.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
nav.tabs{display:flex;gap:6px;margin:16px 0 22px;}
nav.tabs button{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--paper-dim);border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:9px 16px;white-space:nowrap;flex:0 0 auto;}
nav.tabs button.active{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);}
nav.tabs button:hover{color:var(--ink);}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
.grid{display:grid;gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:720px){.grid-3,.grid-2{grid-template-columns:1fr;}}
.stat{padding:16px 18px;}
.stat .num{font-size:30px;font-weight:800;line-height:1;letter-spacing:-0.02em;}
.stat .label{font-size:10.5px;color:var(--muted);margin-top:6px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;}
.stat.alert .num{color:var(--red);}
.stat.ok .num{color:var(--green);}
section.block{margin-bottom:28px;}
section.block > h2{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
section.block > h2 .btn-add{font-size:11px;font-weight:700;color:#fff;background:var(--amber);border:none;border-radius:6px;padding:6px 12px;cursor:pointer;text-transform:none;letter-spacing:0;}
section.block > h2 .btn-add:hover{background:var(--gold-dark);}
.wedding-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.wedding-row:hover{border-color:var(--gold);}
.date-chip{font-size:12px;text-align:center;background:var(--paper-dim);border-radius:7px;padding:6px 9px;min-width:52px;line-height:1.2;}
.date-chip .d{font-size:16px;font-weight:600;display:block;}
.wedding-row .info{flex:1;min-width:0;}
.wedding-row .info .client{font-weight:600;font-size:14.5px;}
.wedding-row .info .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.progress-mini{font-size:11.5px;background:var(--paper-dim);padding:4px 8px;border-radius:6px;white-space:nowrap;}
.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.pill.not-started{background:var(--paper-dim);color:var(--muted);}
.pill.in-progress{background:var(--amber-dim);color:var(--amber);}
.pill.done{background:var(--green-dim);color:var(--green);}
.pill.delayed{background:var(--red-dim);color:var(--red);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;}
.overlay.show{display:block;}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--card);
  border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  max-height:86vh;overflow-y:auto;width:100%;max-width:640px;margin:0 auto;
  padding:10px 22px 26px;transform:translateY(100%);transition:transform .22s ease;}
.overlay.show .modal{transform:translateY(0);}
.modal::before{content:'';display:block;width:36px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 14px;}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;}
@media(min-width:640px){.overlay{display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}.overlay:not(.show){display:none;}.modal{position:static;border-radius:12px;transform:none;margin-top:20px;padding:22px;}.modal::before{display:none;}}
.field{margin-bottom:14px;}
.field label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--paper-dim);color:var(--ink);}
.field textarea{resize:vertical;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.staff-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;max-height:180px;overflow-y:auto;padding:2px;}
.staff-check{display:flex;align-items:center;gap:8px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px 9px;cursor:pointer;background:var(--paper-dim);}
.staff-check input{width:auto;}
.staff-check.freelancer{border-style:dashed;border-color:var(--blue);}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
.btn{font-weight:700;font-size:14px;padding:11px 18px;border-radius:9px;border:none;cursor:pointer;}
.btn-primary{background:var(--amber);color:#fff;}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--line);}
.btn-sm{padding:6px 11px;font-size:12px;}
.back-link{font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:14px;display:inline-block;}
.back-link:hover{color:var(--ink);}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.event-card{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--card);overflow:hidden;}
.event-card .ehead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none;gap:10px;}
.event-card .ehead-left{display:flex;align-items:center;gap:8px;min-width:0;}
.event-card .echev{font-size:11px;color:var(--muted);transition:transform .15s;flex-shrink:0;}
.event-card .echev.open{transform:rotate(90deg);}
.event-card .ename{font-weight:700;font-size:13.5px;white-space:nowrap;}
.event-card .edate{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.event-card .ebody{display:none;padding:0 14px 14px;border-top:1px solid var(--line);}
.event-card .ebody.open{display:block;padding-top:10px;}
.team-line{font-size:12.5px;color:var(--ink);margin-top:4px;}
.team-line b{color:var(--muted);font-weight:600;font-size:11px;margin-right:6px;}
.chip{display:inline-block;font-size:11.5px;background:var(--paper-dim);padding:3px 9px;border-radius:20px;margin:2px 3px 2px 0;}
.chip.freelancer{background:var(--blue-dim);color:var(--blue);}
.track-group{margin-bottom:18px;}
.track-group-title{font-size:10.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;}
.stage-row{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.stage-node{display:flex;flex-direction:column;align-items:center;flex:1 1 0;min-width:96px;text-align:center;cursor:pointer;}
.stage-dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:2px solid var(--line);background:var(--card);color:var(--muted);transition:border-color .15s;}
.stage-node.done .stage-dot{background:var(--green);border-color:var(--green);color:#fff;}
.stage-node.active .stage-dot{background:var(--amber);border-color:var(--amber);color:#fff;}
.stage-node.stuck .stage-dot{background:var(--red);border-color:var(--red);color:#fff;}
.stage-node.expanded .stage-dot{box-shadow:0 0 0 3px var(--paper-dim);}
.stage-node:hover .stage-dot{border-color:var(--gold);}
.stage-name{font-size:12px;font-weight:700;margin-top:9px;color:var(--ink);}
.stage-count{font-size:10.5px;color:var(--muted);margin-top:2px;}
.stage-node.stuck .stage-count{color:var(--red);font-weight:600;}
.stage-detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.stage-detail-head h3{font-size:15px;font-weight:800;}
.track-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:8px;flex-wrap:wrap;}
.track-row .tname{font-weight:600;font-size:13px;min-width:150px;flex:1;}
.track-row .tmeta{font-size:11px;color:var(--muted);}
.track-row select{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);}
.track-row input[type=date]{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);width:126px;}
.track-row input[type=text]{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);width:150px;}
.track-row a.link-out{font-size:11px;color:var(--blue);font-weight:600;}
.overall-progress{margin:10px 0 24px;}
.bar-track{height:7px;border-radius:5px;background:var(--paper-dim);overflow:hidden;}
.bar-fill{height:100%;background:var(--amber);border-radius:5px;transition:width .2s;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px;}
.dm-event-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--card);}
.dm-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line);}
.dm-row:last-child{border-bottom:none;}
.dm-row-label{width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:var(--muted);text-align:center;gap:2px;padding:8px 0;}
.dm-cells{display:flex;flex-wrap:wrap;flex:1;gap:0;}
.dm-cell{position:relative;flex:1 1 130px;max-width:200px;padding:12px 14px;cursor:pointer;border-right:1px solid rgba(255,255,255,.5);}
.dm-cell.pending{background:var(--red-dim);}
.dm-cell.copied{background:var(--green-dim);}
.dm-name{font-weight:700;font-size:12.5px;color:var(--ink);}
.dm-size{font-size:10.5px;margin-top:4px;color:var(--muted);opacity:.85;}
.dm-size-input{display:none;margin-top:4px;width:90px;font-size:11px;padding:3px 5px;border:1px solid rgba(0,0,0,.2);border-radius:5px;background:rgba(255,255,255,.8);}
.dm-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.15);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:16px;text-align:center;cursor:pointer;}
.dm-add{flex:1 1 100px;max-width:140px;display:flex;align-items:center;justify-content:center;padding:12px 10px;border:1px dashed var(--line);cursor:pointer;text-align:center;font-size:11.5px;color:var(--amber);font-weight:700;}
.fab{position:fixed;bottom:20px;right:18px;z-index:60;background:var(--amber);color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;box-shadow:0 4px 14px rgba(232,103,10,.35);border:none;cursor:pointer;}
.fev-box{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--card);}
.fev-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line);}
.fev-row:first-of-type{border-top:none;margin-top:8px;}
.fev-row select{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);}
.fev-row input[type=text]{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);width:130px;}
.ledger-row{display:flex;align-items:center;gap:10px;padding:3px 4px;border-bottom:1px solid var(--line);min-height:0;}
.ledger-date{width:88px;flex-shrink:0;font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap;}
.ledger-content{flex:1;font-size:11.5px;line-height:1.3;}
.ledger-content-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ledger-content.muted{color:var(--muted);}
.ledger-row.holiday{background:var(--red-dim);border-radius:6px;padding:3px 4px;}
.ledger-task{display:inline-flex;align-items:center;gap:5px;flex-wrap:nowrap;white-space:nowrap;}
.ledger-task .tname{font-size:11.5px;}
.ledger-task select{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:2px 4px;background:var(--paper-dim);}
.ledger-task .btn-sm{padding:2px 7px;font-size:10px;}
.ledger-add{color:var(--amber);font-weight:700;font-size:10.5px;cursor:pointer;white-space:nowrap;}
.ledger-inline-assign{display:inline-flex;align-items:center;gap:4px;}
.ledger-mini-select{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:2px 4px;background:var(--paper-dim);max-width:120px;}
.ledger-mini-input{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:2px 4px;background:var(--paper-dim);width:70px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<datalist id="clientNamesList"></datalist>
<datalist id="peopleNamesList"></datalist>

<script>
// ---------- Sample people data ----------
const APP_VERSION = 'v31';
const OWNER = {id:'owner1', name:'Rahul Gauri', title:'Owner', accountRole:'owner', skills:[], loginId:'admin', password:'admin123'};
const EMPLOYEES = [];
const FREELANCERS = [];
EMPLOYEES.forEach(p=>{ if(p.loginId===undefined) p.loginId=p.name.split(' ')[0].toLowerCase(); if(p.password===undefined) p.password='123'; });
// getAllPeople() is a live lookup, not a frozen snapshot — EMPLOYEES/FREELANCERS get
// repopulated in place after the async Firestore load and whenever staff are added, so a
// one-time [...EMPLOYEES,...FREELANCERS] copy taken here at script-eval time would go stale.
function getAllPeople(){ return [...EMPLOYEES, ...FREELANCERS]; }
const ACCOUNTS = [OWNER, ...EMPLOYEES]; // freelancers have no login
function personName(id){ return id===OWNER.id ? OWNER.name : (getAllPeople().find(p=>p.id===id)?.name || id); }
function isFreelancer(id){ return FREELANCERS.some(p=>p.id===id); }
const ROLE_LABEL = {owner:'Owner', manager:'Manager', staff:'Staff'};
const SKILL_LABEL = {still:'Still Photography', cine:'Cinematography', lightroom:'Lightroom', photoshop:'Photoshop',
  teaser:'Teaser', instacut:'Insta-cut', story:'Wedding Story', reels:'Reels', fullVideo:'Full Video', videoBook:'Video Book'};
const ALL_SKILLS = Object.keys(SKILL_LABEL);
let currentUser = null; // set after login



const STATUS = ['not-started','in-progress','done'];
const STATUS_LABEL = {'not-started':'Not Started','in-progress':'In Progress','done':'Done'};
const DATA_STATUS = ['pending','copied'];

// ---------- Track definitions (all wedding-wide now) ----------
const WEDDING_TRACKS = [
  {key:'allPhotos', label:'All Photographs (watermarked, low-res)', platform:'Google Drive'},
  {key:'photoFrames', label:'Photo Frames', platform:''},
  {key:'videoBook', label:'Video Book', platform:'', skill:'videoBook'},
  {key:'albumDesign', label:'Album Design', platform:''},
  {key:'albumUpload', label:'Album Upload', platform:'Google Drive'},
  {key:'printing', label:'Album Printing', platform:''},
  {key:'delivery', label:'Delivery to Client', platform:''},
  {key:'deliveryDone', label:'Delivery Done', platform:''},
];
// Video Editing sub-items (wedding-wide, single assignee each)
const VIDEO_EDITING_SINGLE = [
  {key:'teaser', label:'Teaser', platform:'Vimeo', skill:'teaser'},
  {key:'instacut', label:'Insta-cut', platform:'Vimeo', skill:'instacut'},
  {key:'story', label:'Wedding Story', platform:'Vimeo', skill:'story'},
  {key:'reels', label:'Reels', platform:'Vimeo', skill:'reels'},
];

function newTrackObj(defaultAssignee){
  return {status:'not-started', assignee:defaultAssignee||'', start:'', due:'', link:''};
}
function newPhotoEditingObj(){
  return {
    lightroom: {status:'not-started', assignee:'', start:'', due:'', link:''},
    photoshop: {status:'not-started', assignee:'', start:'', due:''}
  };
}
function newVideoEditingObj(events){
  const fullVideo={};
  events.forEach(ev=> fullVideo[ev.id]=newTrackObj());
  const obj={fullVideo};
  VIDEO_EDITING_SINGLE.forEach(t=> obj[t.key]=newTrackObj());
  return obj;
}
function newDataManagementObj(events){
  return {hardDisks:[], events:{}}; // events[id].still/video = [{pid,status,dataSize}], lazy-initialized from event team
}
function weddingWideTracks(w){
  return {
    allPhotos:newTrackObj(), photoFrames:newTrackObj(), videoBook:newTrackObj(),
    albumDesign:newTrackObj(), albumUpload:newTrackObj(), printing:newTrackObj(), delivery:newTrackObj(), deliveryDone:newTrackObj()
  };
}

// ---------- Weddings (starts empty) ----------
let WEDDINGS = [];

let currentTab='dashboard';
let currentWeddingId=null;

let __idCounter=0;
function genId(){ return 'w'+Date.now().toString(36)+(__idCounter++).toString(36)+Math.random().toString(36).slice(2,6); }
function genEventId(){ return 'ev'+Date.now().toString(36)+(__idCounter++).toString(36)+Math.random().toString(36).slice(2,6); }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function next30DayOptions(selected){
  let opts = `<option value="">—</option>`;
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<=30;i++){
    const d=new Date(today); d.setDate(d.getDate()+i);
    const iso=d.toISOString().slice(0,10);
    const label=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    opts += `<option value="${iso}" ${selected===iso?'selected':''}>${label}</option>`;
  }
  if(selected && !opts.includes(`value="${selected}"`)){
    opts += `<option value="${selected}" selected>${fmtDate(selected)} (past)</option>`;
  }
  return opts;
}
function eligiblePeopleFor(skillKey){
  if(!skillKey) return getAllPeople();
  return getAllPeople().filter(p=> p.type==="freelancer" || (p.skills||[]).includes(skillKey));
}
function isSunday(dateStr){ return dateStr && new Date(dateStr+'T00:00:00').getDay()===0; }
function shiftDateSkippingSunday(dateStr, days){
  if(!dateStr) return dateStr;
  let d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  while(d.getDay()===0){ d.setDate(d.getDate()+1); }
  return d.toISOString().slice(0,10);
}
function dateChip(d){ if(!d) return {day:'—', mon:''}; const dt=new Date(d+'T00:00:00'); return {day:dt.getDate(), mon:dt.toLocaleDateString('en-IN',{month:'short'})}; }
// A wedding has no date of its own — it's just a group of events, each dated separately —
// so anywhere we used to show "the wedding date" now shows its earliest event's date.
function earliestEventDate(w){
  const dates=w.events.map(e=>e.date).filter(Boolean).sort();
  return dates.length ? dates[0] : null;
}

// ---------- progress calc ----------
function allTracksOf(w){
  let list=[];
  WEDDING_TRACKS.forEach(t=> list.push(w.tracks[t.key]));
  list.push(w.photoEditing.lightroom, w.photoEditing.photoshop);
  VIDEO_EDITING_SINGLE.forEach(t=> list.push(w.videoEditing[t.key]));
  w.events.forEach(ev=> list.push(w.videoEditing.fullVideo[ev.id]));
  return list;
}
function progressOf(w){
  const list=allTracksOf(w);
  const done=list.filter(t=>t.status==='done').length;
  return {done, total:list.length, pct: list.length? Math.round(done/list.length*100):0};
}
function isDelayed(t){
  if(!t.due || !t.assignee || t.status==='done') return false;
  return new Date(t.due) < new Date(new Date().toDateString());
}

// ---------- Render shell ----------
function render(){
  if(!currentUser){ renderLogin(); return; }
  document.getElementById('clientNamesList').innerHTML = WEDDINGS.map(w=>`<option value="${esc(w.client)}">`).join('');
  document.getElementById('peopleNamesList').innerHTML = getAllPeople().map(p=>`<option value="${esc(p.name)}">`).join('');
  const isOwner = currentUser.accountRole==='owner';
  const isManager = currentUser.accountRole==='manager';
  const isStaff = currentUser.accountRole==='staff';
  document.getElementById('app').innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="mark"></div>

// ---------- My Tasks / Assign Work (date ledger, shared between staff self-view and owner/manager staff-wise view) ----------
// Escape text before dropping it into HTML/attributes — client names, event names, notes etc. are
// free-text user input and must never be interpolated raw (breaks onclick="" attrs on apostrophes,
// and is a stored-XSS risk otherwise).
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Each item carries a stable `ref` (kind + key, matching getTrackByRef) so callers never have to
// match on the human-readable label string, which can collide (duplicate event names) or contain
// characters (apostrophes, quotes) that break inline onclick="" handlers.
function collectAssignedItems(personId){
  const items=[];
  WEDDINGS.forEach(w=>{
    if(w.photoEditing.lightroom.assignee===personId) items.push({w, label:'Lightroom — Photo Editing', track:w.photoEditing.lightroom, ref:{kind:'photoEditing', trackKey:'lightroom'}});
    if(w.photoEditing.photoshop.assignee===personId) items.push({w, label:'Photoshop — Photo Editing', track:w.photoEditing.photoshop, ref:{kind:'photoEditing', trackKey:'photoshop'}});
    VIDEO_EDITING_SINGLE.forEach(t=>{ if(w.videoEditing[t.key].assignee===personId) items.push({w, label:t.label+' — Video Editing', track:w.videoEditing[t.key], ref:{kind:'videoEditingSingle', trackKey:t.key}}); });
    w.events.forEach(ev=>{ if(w.videoEditing.fullVideo[ev.id].assignee===personId) items.push({w, label:ev.name+' — Full Video', track:w.videoEditing.fullVideo[ev.id], ref:{kind:'fullVideo', eventId:ev.id}}); });
    WEDDING_TRACKS.forEach(t=>{ if(w.tracks[t.key].assignee===personId) items.push({w, label:t.label, track:w.tracks[t.key], ref:{kind:'wedding', trackKey:t.key}}); });
  });
  return items;
}
// Scoped to a single wedding — shifting a delayed task should never silently reschedule a person's
// work on other, unrelated weddings.
function shiftFutureTasks(personId, weddingId, afterDate, days){
  collectAssignedItems(personId).filter(i=>i.w.id===weddingId).forEach(item=>{
    if(item.track.due && item.track.due > afterDate) item.track.due = shiftDateSkippingSunday(item.track.due, days);
    if(item.track.start && item.track.start > afterDate) item.track.start = shiftDateSkippingSunday(item.track.start, days);
  });
}
function promptShiftSchedule(personId, weddingId, refStr){
  const daysStr = prompt("How many days delayed? This shifts this person's other upcoming tasks on this wedding forward by this many days (Sundays are skipped).", '1');
  const days = parseInt(daysStr,10);
  if(!days || days<1) return;
  const ref=JSON.parse(decodeURIComponent(refStr));
  const w=WEDDINGS.find(x=>x.id===weddingId);
  if(!w) return;
  const track=getTrackByRef(w, ref);
  if(!track) return;
  const afterDate = track.due || new Date().toISOString().slice(0,10);
  shiftFutureTasks(personId, weddingId, afterDate, days);
  renderTab();
}
function renderMyTasks(){ return renderScheduleFor(currentUser.id, currentUser.id); }
function renderScheduleFor(personId, actingUserId){
  const items=collectAssignedItems(personId);
  const person=EMPLOYEES.find(x=>x.id===personId);
  const duties=awDutyOptions(person);
  // Self-assign is always available here — staff can log their own work without an
  // Owner/Manager having assigned it first; this is not gated behind actingUserId anymore.
  const canAssignInline = true;
  const today=new Date(); today.setHours(0,0,0,0);
  const rangeStart=new Date(today.getFullYear(), today.getMonth()-1, 1);
  const rangeEnd=new Date(today.getFullYear(), today.getMonth()+2, 0);
  let html=''; let lastMonth='';
  for(let d=new Date(rangeStart); d<=rangeEnd; d.setDate(d.getDate()+1)){
    const iso=d.toISOString().slice(0,10);
    const monthLabel=d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    if(monthLabel!==lastMonth){ html+=`<div class="track-group-title" style="margin-top:18px;">${monthLabel}</div>`; lastMonth=monthLabel; }
    const dayItems=items.filter(i=>i.track.due===iso);
    const sunday=d.getDay()===0;
    const isToday=iso===today.toISOString().slice(0,10);
    const dateLabel=d.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'});
    let content='';
    // Sunday stays visually flagged in red, but it's not a hard block — someone can still
    // be assigned or log work on a Sunday, so we no longer skip building the row's content.
    if(sunday) content += `<span class="tmeta" style="color:var(--red);font-weight:700;margin-right:8px;">Sunday</span>`;
    if(dayItems.length){
      content += dayItems.map(item=>{
        const delayed=isDelayed(item.track);
        const statusCls=delayed?'delayed':item.track.status;
        const statusText=delayed?'Delayed':STATUS_LABEL[item.track.status];
        const refStr=encodeURIComponent(JSON.stringify(item.ref));
        return `<span class="ledger-task">
          <span class="pill ${statusCls}">${statusText}</span>
          <span class="tname">${esc(item.label)} <span class="tmeta">— ${esc(item.w.client)}</span></span>
          <select onchange="updateMyTask('${personId}','${item.w.id}','${refStr}',this.value)">
            ${STATUS.map(s=>`<option value="${s}" ${item.track.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
          </select>
          ${item.track.notes?`<span class="tmeta" title="${esc(item.track.notes)}">📝 ${esc(item.track.notes)}</span>`:''}
          ${delayed?`<button class="btn btn-ghost btn-sm" onclick="promptShiftSchedule('${personId}','${item.w.id}','${refStr}')">Shift Future Work</button>`:''}
        </span>`;
      }).join('');
    }
    if(canAssignInline){
      content += `
        <span class="ledger-inline-assign">
          <input list="clientNamesList" id="cli_${iso}" class="ledger-mini-select" placeholder="Client..." onchange="dmInlineHandle('${personId}','${iso}')">
          <select id="duty_${iso}" class="ledger-mini-select" onchange="dmInlineHandle('${personId}','${iso}')">
            <option value="">Work Done...</option>
            ${duties.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}
          </select>
          <select id="ev_${iso}" class="ledger-mini-select" style="display:none;" onchange="dmInlineHandle('${personId}','${iso}')"></select>
          <input id="link_${iso}" class="ledger-mini-input" placeholder="link" onchange="dmInlineHandle('${personId}','${iso}')">
          <input id="notes_${iso}" class="ledger-mini-input" placeholder="notes" onchange="dmInlineHandle('${personId}','${iso}')">
        </span>
      `;
    }
    html+=`<div class="ledger-row${sunday?' holiday':''}"><span class="ledger-date">${dateLabel}${isToday?' · Today':''}</span><span class="ledger-content ledger-content-inline">${content}</span></div>`;
  }
  return `<section class="block"><h2>${actingUserId?'My Schedule':'Schedule'}</h2>${html}</section>`;
}
function dmInlineHandle(personId, dateIso){
  const cliEl=document.getElementById('cli_'+dateIso);
  const dutyEl=document.getElementById('duty_'+dateIso);
  const evEl=document.getElementById('ev_'+dateIso);
  const linkEl=document.getElementById('link_'+dateIso);
  const notesEl=document.getElementById('notes_'+dateIso);
  if(!cliEl||!dutyEl) return;
  const cliName=cliEl.value.trim();
  const duty=dutyEl.value;
  if(!cliName){ evEl.style.display='none'; return; }
  // Typing an existing client's name reuses that wedding; typing a new name creates one
  // on the spot (dated to the row being filled in) so it shows up under Weddings too.
  const w=findOrCreateWeddingByName(cliName);
  const cli=w.id;
  // show/populate event picker only when Full Event Video is the chosen duty
  if(duty==='fullVideo'){
    evEl.innerHTML = w.events.map(ev=>`<option value="${ev.id}">${esc(ev.name)}</option>`).join('') || '<option value="">No events yet</option>';
    evEl.style.display='inline-block';
  } else {
    evEl.style.display='none';
  }
  if(!duty) return;
  let eventId='';
  if(duty==='fullVideo'){
    eventId=evEl.value;
    if(!eventId) return; // wait until an event is picked too
  }
  const link=linkEl?linkEl.value.trim():'';
  const notes=notesEl?notesEl.value.trim():'';
  assignTrackForPerson(cli, duty, eventId, personId, '', dateIso, link, '', notes);
  renderTab();
}
function updateMyTask(personId, weddingId, refStr, value){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  if(!w) return;
  const ref=JSON.parse(decodeURIComponent(refStr));
  const track=getTrackByRef(w, ref);
  if(track) track.status=value;
  renderTab();
}

function awDutyOptions(person){
  const all = [
    {value:'photoEditing:lightroom', label:'Lightroom — Photo Editing', skill:'lightroom'},
    {value:'photoEditing:photoshop', label:'Photoshop — Photo Editing', skill:'photoshop'},
    ...VIDEO_EDITING_SINGLE.map(t=>({value:'videoEditingSingle:'+t.key, label:t.label+' — Video Editing', skill:t.skill})),
    {value:'fullVideo', label:'Full Event Video (pick event below)', skill:'fullVideo'},
    ...WEDDING_TRACKS.map(t=>({value:'wedding:'+t.key, label:t.label, skill:t.skill}))
  ];
  const skills = (person && person.skills) || [];
  // duties tied to a specific skill only show if this person has that skill tagged;
  // duties with no skill requirement (open tasks like Album/Delivery) always show
  return all.filter(o=> !o.skill || skills.includes(o.skill));
}

    wrap.style.display='block';
  } else {
    wrap.style.display='none';
  }

function assignTrackForPerson(weddingId, dutyValue, eventId, personId, start, due, link, status, notes){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  let t=null;
  if(dutyValue==='photoEditing:lightroom' || dutyValue==='photoEditing:photoshop'){
    t=w.photoEditing[dutyValue.split(':')[1]];
  } else if(dutyValue==='fullVideo'){
    t=w.videoEditing.fullVideo[eventId];
  } else if(dutyValue.startsWith('videoEditingSingle:')){
    t=w.videoEditing[dutyValue.split(':')[1]];
  } else if(dutyValue.startsWith('wedding:')){
    t=w.tracks[dutyValue.split(':')[1]];
  }
  if(!t) return false;
  t.assignee=personId;
  if(start) t.start=start;
  if(due) t.due=due;
  if(link) t.link=link;
  if(status) t.status=status;
  if(notes) t.notes=notes;
  return true;
}
function submitAssignWork(personId){
  const duty=document.getElementById('f_awDuty').value;
  const weddingId=document.getElementById('f_awWedding').value;
  const eventEl=document.getElementById('f_awEvent');
  const eventId=eventEl?eventEl.value:'';

  const due=document.getElementById('f_awDue').value;
  const link=document.getElementById('f_awLink').value.trim();
  const errEl=document.getElementById('f_awError');

  if(duty==='fullVideo' && !eventId){ errEl.textContent='Pick which event this Full Video is for.'; return; }
  assignTrackForPerson(weddingId, duty, eventId, personId, start, due, link);
  renderTab();
}

function saveStaff(personId, jumpToWork){
  const name=document.getElementById('f_stName').value.trim();
  const title=document.getElementById('f_stTitle').value.trim();
  const accountRole=document.getElementById('f_stRole').value;
  const skills=[...document.querySelectorAll('.skillbox:checked')].map(c=>c.value);
  const loginId=document.getElementById('f_stLoginId').value.trim();
  const password=document.getElementById('f_stPassword').value;
  const errEl=document.getElementById('staffModalError');
  if(!name){ alert('Name is required'); return; }
  if(!loginId||!password){ errEl.textContent='Login ID and password are required.'; return; }
  const clash=EMPLOYEES.find(x=>x.id!==personId && x.loginId.toLowerCase()===loginId.toLowerCase());
  if(clash || (OWNER.loginId||'').toLowerCase()===loginId.toLowerCase()){ errEl.textContent='That login ID is already taken.'; return; }

  let newId=personId;
  if(personId){
    const p=EMPLOYEES.find(x=>x.id===personId);
    p.name=name; p.title=title; p.accountRole=accountRole; p.skills=skills; p.loginId=loginId; p.password=password;
  } else {
    newId='e'+Math.random().toString(36).slice(2,9);
    EMPLOYEES.push({id:newId, name, title, type:'inhouse', accountRole, skills, loginId, password});
  }
  closeModal();
  if(jumpToWork){ assignWorkStaffId=newId; }
  renderTab();
}
function saveOwnerAccount(){
  const loginId=document.getElementById('f_ownerLoginId').value.trim();
  const password=document.getElementById('f_ownerPassword').value;
  if(!loginId||!password){ alert('Login ID and password are required.'); return; }
  OWNER.loginId=loginId; OWNER.password=password;
  renderTab();

function deleteStaff(personId){
  const idx=EMPLOYEES.findIndex(x=>x.id===personId);

  renderTab();
}

// ---------- Post-Production as parallel stages (Option E) — no connecting lines/sequence
// implied, since Photo Editing / Video Editing / Album & Delivery all run at the same time
// at Fotovision, not one after another. Each bead is its own independent status; clicking
// one expands its tasks below. Categories mirror the track-groups that already existed.
function stageCategories(w){
  const photoTracks=[w.photoEditing.lightroom, w.photoEditing.photoshop];
  const videoTracks=[...VIDEO_EDITING_SINGLE.map(t=>w.videoEditing[t.key]), ...w.events.map(ev=>w.videoEditing.fullVideo[ev.id])];
  const albumTracks=WEDDING_TRACKS.map(t=>w.tracks[t.key]);
  function summarize(list){
    return {done:list.filter(t=>t.status==='done').length, total:list.length, stuck:list.some(isDelayed)};
  }
  return [
    {key:'photoEditing', label:'Photo Edit', ...summarize(photoTracks)},
    {key:'videoEditing', label:'Video Edit', ...summarize(videoTracks)},
    {key:'albumDelivery', label:'Album &amp; Delivery', ...summarize(albumTracks)},
  ];
}
let expandedStage=null;
function setExpandedStage(key){ expandedStage = (expandedStage===key ? null : key); renderTab(); }
function renderStageRow(w){
  const stages=stageCategories(w);
  if(expandedStage===null) expandedStage = (stages.find(s=>s.stuck) || stages.find(s=>s.done<s.total) || stages[0]).key;
  return `
    <div class="stage-row">
      ${stages.map(s=>{
        const cls = s.stuck ? 'stuck' : (s.done===s.total && s.total>0) ? 'done' : (s.done>0 ? 'active' : '');
        const dotContent = s.stuck ? (s.total-s.done) : (s.done===s.total && s.total>0) ? '&#10003;' : (s.total-s.done);
        const countText = s.stuck ? `${s.total-s.done} delayed` : (s.done===s.total && s.total>0) ? 'done' : (s.done>0? `${s.done}/${s.total} done` : 'not started');
        return `
        <div class="stage-node ${cls}${expandedStage===s.key?' expanded':''}" onclick="setExpandedStage('${s.key}')">
          <div class="stage-dot">${dotContent}</div>
          <div class="stage-name">${s.label}</div>
          <div class="stage-count">${countText}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}
function renderStageDetail(w){
  const stages=stageCategories(w);
  const current = stages.find(s=>s.key===expandedStage) || stages[0];
  let body='';
  if(current.key==='photoEditing'){
    body = renderPhotoEditingRow(w, 'lightroom', 'Lightroom', true) + renderPhotoEditingRow(w, 'photoshop', 'Photoshop', false);
  } else if(current.key==='videoEditing'){
    body = VIDEO_EDITING_SINGLE.map(t=>renderTrackRow(w.id, t, w.videoEditing[t.key], {kind:'videoEditingSingle', trackKey:t.key})).join('') + renderFullVideoBox(w);
  } else {
    body = WEDDING_TRACKS.map(t=>renderTrackRow(w.id, t, w.tracks[t.key], {kind:'wedding', trackKey:t.key})).join('');
  }
  return `
    <div class="card stage-detail">
      <div class="stage-detail-head">
        <h3>${current.label.replace('&amp;','and')}</h3>
        ${current.stuck?`<span class="pill delayed">${current.total-current.done} Delayed</span>`:''}
      </div>
      ${body}
    </div>
  `;
}

function getTrackByRef(w, ref){
  if(ref.kind==='wedding') return w.tracks[ref.trackKey];
  if(ref.kind==='videoEditingSingle') return w.videoEditing[ref.trackKey];
  if(ref.kind==='fullVideo') return w.videoEditing.fullVideo[ref.eventId];
  if(ref.kind==='photoEditing') return w.photoEditing[ref.trackKey];
}
function updateTrack(weddingId, refStr, field, value){
  const w=WEDDINGS.find(x=>x.id===weddingId);

  const ref=JSON.parse(decodeURIComponent(refStr));
  const track=getTrackByRef(w, ref);
  track[field]=value;
  renderTab();
}

}
function toggleDmStatus(weddingId, eventId, cat, idx){

  const entry=w.dataManagement.events[eventId][cat][idx];
  entry.status = entry.status==='copied' ? 'pending' : 'copied';

}
function removeDmPerson(weddingId, eventId, cat, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const entry=w.dataManagement.events[eventId][cat][idx];
  document.getElementById('modalBody').innerHTML = `
    <h3>Remove ${esc(personName(entry.pid))}?</h3>
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:6px;">This removes them from the ${cat==='still'?'Still':'Video'} data tracking for this event${entry.dataSize?` — recorded size (${esc(entry.dataSize)}) will be lost.`:'.'}</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="background:var(--red);" onclick="confirmRemoveDmPerson('${weddingId}','${eventId}','${cat}',${idx})">Remove</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function confirmRemoveDmPerson(weddingId, eventId, cat, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.dataManagement.events[eventId][cat].splice(idx,1);
  closeModal();
  renderTab();
}
function openAddDmPerson(weddingId, eventId, cat){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const already=w.dataManagement.events[eventId][cat].map(e=>e.pid);
  const options=getAllPeople().filter(p=>!already.includes(p.id));
  document.getElementById('modalBody').innerHTML = `
    <h3>Add Person — ${cat==='still'?'Still':'Video'} Data</h3>
    <div class="field">
      <label>Select Person</label>
      <input list="dmPersonOptions" id="f_dmPerson" placeholder="Type a staff name...">
      <datalist id="dmPersonOptions">
        ${options.map(p=>`<option value="${esc(p.name)}${p.type==='freelancer'?' (freelancer)':''}">`).join('')}
      </datalist>
      ${!options.length?'<div style="font-size:11px;color:var(--muted);margin-top:4px;">Everyone is already added for this category.</div>':''}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAddDmPerson('${weddingId}','${eventId}','${cat}')">Add</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function saveAddDmPerson(weddingId, eventId, cat){
  const typed=document.getElementById('f_dmPerson').value.trim();
  if(!typed){ closeModal(); return; }
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const already=w.dataManagement.events[eventId][cat].map(e=>e.pid);
  let match=getAllPeople().find(p=>{
    if(already.includes(p.id)) return false;
    const display=p.name+(p.type==='freelancer'?' (freelancer)':'');
    return display.toLowerCase()===typed.toLowerCase() || p.name.toLowerCase()===typed.toLowerCase();
  });
  if(!match){
    // Typed a name nobody recognizes — create a new freelancer on the spot instead of
    // silently doing nothing, same as the event team picker does.
    match={id:genId(), name:typed, type:'freelancer', title:'Freelancer'};
    FREELANCERS.push(match);
  }
  w.dataManagement.events[eventId][cat].push({pid:match.id, status:'pending', dataSize:''});
  closeModal();
  renderTab();
}
function addHardDisk(weddingId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const inp=document.getElementById('newHdInput_'+weddingId);
  const name=inp.value.trim();
  if(!name) return;
  w.dataManagement.hardDisks.push(name);
  renderTab();
}
function removeHardDisk(weddingId, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.dataManagement.hardDisks.splice(idx,1);
  renderTab();
}

function deleteWedding(id){
  WEDDINGS=WEDDINGS.filter(x=>x.id!==id);
  currentWeddingId=null;
  renderTab();
}

function emptyState(msg){ return `<div class="empty">${msg}</div>`; }

// ---------- New wedding modal ----------

  document.getElementById('modalBody').innerHTML = `
    <h3>New Wedding Booking</h3>
    <div class="field"><label>Client Names</label><input id="f_client" placeholder="e.g. Karan & Simran"></div>

function saveNewWedding(){

  if(!client){ alert('Client name is required'); return; }
  const w={
    id:genId(), client, events:[],
    photoEditing:newPhotoEditingObj(),
    videoEditing:newVideoEditingObj([]),
    dataManagement:newDataManagementObj([]),
    tracks:weddingWideTracks()
  };
  WEDDINGS.push(w);
  closeModal();
  currentWeddingId=w.id;
  renderTab();
}
// Used by the inline "Client..." combo box on the schedule/ledger rows — typing an
// existing client's name reuses that wedding; typing a brand-new name creates one right
// there so it shows up under Weddings like any other. No date is set on the wedding
// itself — dates live on its events.
function findOrCreateWeddingByName(name){
  name=(name||'').trim();
  if(!name) return null;
  let w=WEDDINGS.find(x=>x.client.trim().toLowerCase()===name.toLowerCase());
  if(!w){
    w={
      id:genId(), client:name, events:[],
      photoEditing:newPhotoEditingObj(),
      videoEditing:newVideoEditingObj([]),
      dataManagement:newDataManagementObj([]),
      tracks:weddingWideTracks()
    };
    WEDDINGS.push(w);
  }
  return w;
}

// ---------- Event modal (add/edit team) ----------
// Team selection is a type-to-add tag input, not a checkbox grid: typing an existing
// staff/freelancer's name and pressing Enter (or picking the autocomplete suggestion)
// adds them as a chip. Typing a name nobody recognizes creates a new freelancer entry on
// the spot, so it's remembered and suggested next time too.
let evTeamStill=[];
let evTeamCine=[];
function renderTeamPicker(cat){
  const selected = cat==='still' ? evTeamStill : evTeamCine;
  const chips = selected.map(pid=>`
    <span class="chip ${isFreelancer(pid)?'freelancer':''}">${esc(personName(pid))} <span style="cursor:pointer;" onclick="removeTeamPerson('${cat}','${pid}')">&times;</span></span>
  `).join('') || '<span style="color:var(--muted);font-size:12px;">nobody added yet</span>';
  return `
    <div style="margin-bottom:8px;">${chips}</div>
    <input list="peopleNamesList" id="f_addPerson_${cat}" placeholder="Type a name and press Enter" style="width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--paper-dim);color:var(--ink);" onkeydown="if(event.key==='Enter'){event.preventDefault();addTeamPerson('${cat}');}">
  `;
}
function addTeamPerson(cat){
  const inp=document.getElementById('f_addPerson_'+cat);
  const typed=inp.value.trim();
  if(!typed) return;
  let match=getAllPeople().find(p=>p.name.toLowerCase()===typed.toLowerCase());
  if(!match){
    match={id:genId(), name:typed, type:'freelancer', title:'Freelancer'};
    FREELANCERS.push(match);
  }
  const arr = cat==='still' ? evTeamStill : evTeamCine;
  if(!arr.includes(match.id)) arr.push(match.id);
  inp.value='';
  document.getElementById('teamPicker_'+cat).innerHTML = renderTeamPicker(cat);
  renderTab(); // refreshes the peopleNamesList datalist with any newly added freelancer
}
function removeTeamPerson(cat, pid){
  const arr = cat==='still' ? evTeamStill : evTeamCine;
  const idx=arr.indexOf(pid);
  if(idx>-1) arr.splice(idx,1);
  document.getElementById('teamPicker_'+cat).innerHTML = renderTeamPicker(cat);
}
function openEventModal(weddingId, eventId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const ev = eventId ? w.events.find(e=>e.id===eventId) : null;
  evTeamStill = ev ? [...ev.still] : [];
  evTeamCine = ev ? [...ev.cine] : [];
  document.getElementById('modalBody').innerHTML = `
    <h3>${ev?'Edit Event':'Add Event'} — ${esc(w.client)}</h3>
    <div class="row2">
      <div class="field"><label>Event Name</label><input id="f_ename" placeholder="e.g. Sangeet" value="${ev?esc(ev.name):''}"></div>
      <div class="field"><label>Date</label><input id="f_edate" type="date" value="${ev?ev.date:''}"></div>
    </div>
    <div class="field"><label>Venue</label><input id="f_evenue" placeholder="e.g. ITC Maurya" value="${ev?esc(ev.venue):''}"></div>
    <div class="field"><label>Still Photography Team</label><div id="teamPicker_still">${renderTeamPicker('still')}</div></div>
    <div class="field"><label>Cinematography Team</label><div id="teamPicker_cine">${renderTeamPicker('cine')}</div></div>
    <div class="modal-actions">
      ${ev?`<button class="btn btn-ghost" style="color:var(--red);" onclick="deleteEvent('${weddingId}','${eventId}')">Delete Event</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEvent('${weddingId}','${eventId||''}')">Save Event</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function saveEvent(weddingId, eventId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const name=document.getElementById('f_ename').value.trim();
  const date=document.getElementById('f_edate').value;
  const venue=document.getElementById('f_evenue').value.trim();
  const still=[...evTeamStill];
  const cine=[...evTeamCine];
  if(!name||!date){ alert('Event name and date are required'); return; }
  if(eventId){
    const ev=w.events.find(e=>e.id===eventId);
    ev.name=name; ev.date=date; ev.venue=venue; ev.still=still; ev.cine=cine;
    syncDmWithTeam(w, ev);
  } else {
    const newEvId=genEventId();
    w.events.push({id:newEvId, name, date, venue, still, cine});
    w.videoEditing.fullVideo[newEvId]=newTrackObj();
    // dataManagement auto-initializes from event team on first render (see ensureDmInit)
  }
  closeModal();
  renderTab();
}
// Keep Data Management in sync when the team is edited later — adds newly-checked people
// (without touching status/size already recorded for people still on the team) and removes
// anyone who got unchecked from the team, so DM never holds stale/orphaned entries.
function syncDmWithTeam(w, ev){
  ensureDmInit(w, ev);
  const dm=w.dataManagement.events[ev.id];
  ev.still.forEach(pid=>{ if(!dm.still.some(e=>e.pid===pid)) dm.still.push({pid, status:'pending', dataSize:''}); });
  ev.cine.forEach(pid=>{ if(!dm.video.some(e=>e.pid===pid)) dm.video.push({pid, status:'pending', dataSize:''}); });
  dm.still = dm.still.filter(e=>ev.still.includes(e.pid));
  dm.video = dm.video.filter(e=>ev.cine.includes(e.pid));
}
function deleteEvent(weddingId, eventId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.events=w.events.filter(e=>e.id!==eventId);
  delete w.videoEditing.fullVideo[eventId];
  Object.keys(w.dataManagement.events).forEach(k=>{ if(k===eventId) delete w.dataManagement.events[k]; });
  closeModal();
  renderTab();
}

function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click',(ev)=>{ if(ev.target.id==='overlay') closeModal(); });

Object.assign(window,{setTab, openWeddingDetail, closeWeddingDetail, openWeddingModal, saveNewWedding,
  openEventModal, saveEvent, deleteEvent, updateTrack, updatePhotoEditing, deleteWedding, closeModal,
  addHardDisk, removeHardDisk, toggleDmStatus, openDmSizeInput, saveDmSize, removeDmPerson, openAddDmPerson, saveAddDmPerson, handleFab, toggleEventCard,
  logout, loginAs, updateMyTask, openStaffModal, saveStaff, deleteStaff, confirmRemoveDmPerson,
  openAssignWorkStaff, closeAssignWorkStaff, promptShiftSchedule, setExpandedStage,
  addTeamPerson, removeTeamPerson,
  dmInlineHandle,
  WEDDINGS, EMPLOYEES, FREELANCERS, OWNER, render, attemptLogin, saveOwnerAccount});

render();

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPibb9xFpSukQY2HwSx4DuNo7UgX6YkQk",
    authDomain: "fv-erm.firebaseapp.com",
    projectId: "fv-erm",
    storageBucket: "fv-erm.firebasestorage.app",
    messagingSenderId: "254486145999",
    appId: "1:254486145999:web:8bf567c3e4211cf0e0c0ba"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const stateRef = doc(db, "fotovision_erm", "state");

  let saveTimer = null;
  window.fvScheduleSave = function(){
    if(!window.WEDDINGS) return; // app not ready yet
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await setDoc(stateRef, {
          weddingsJSON: JSON.stringify(window.WEDDINGS),
          employeesJSON: JSON.stringify(window.EMPLOYEES),
          freelancersJSON: JSON.stringify(window.FREELANCERS || []),
          ownerJSON: JSON.stringify(window.OWNER || {}),
          updatedAt: new Date().toISOString()
        });
        console.log("Fotovision ERM: saved to Firestore");
      } catch(e){
        console.error("Fotovision ERM: save failed", e);
      }
    }, 800);
  };

  (async () => {
    try {
      const snap = await getDoc(stateRef);
      if(snap.exists()){
        const data = snap.data();
        const weddings = JSON.parse(data.weddingsJSON || "[]");
        const employees = JSON.parse(data.employeesJSON || "[]");
        const freelancers = JSON.parse(data.freelancersJSON || "[]");
        // Always apply what's in Firestore, even if it's an empty array — a legitimately-emptied
        // list (e.g. Rahul deleted every wedding) must not be silently ignored on next load.
        window.WEDDINGS.length = 0;
        window.WEDDINGS.push(...weddings);
        window.EMPLOYEES.length = 0;
        window.EMPLOYEES.push(...employees);
        window.FREELANCERS.length = 0;
        window.FREELANCERS.push(...freelancers);
        if(data.ownerJSON && window.OWNER){
          const ownerData = JSON.parse(data.ownerJSON);
          if(ownerData.loginId) window.OWNER.loginId = ownerData.loginId;
          if(ownerData.password) window.OWNER.password = ownerData.password;
        }
        console.log("Fotovision ERM: loaded saved data from Firestore");
        if(window.render) window.render();
      } else {
        // first run — seed Firestore with the current sample data
        window.fvScheduleSave();
      }
    } catch(e){
      console.error("Fotovision ERM: load failed, using local sample data", e);
    }
  })();
</script>
