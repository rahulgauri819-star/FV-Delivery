<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fotovision ERM</title>
<style>
:root{
  --ink:#1a1d23; --paper:#f5f6f8; --paper-dim:#f0f1f4; --card:#ffffff;
  --gold:#e8670a; --gold-dim:#fdf0e8; --gold-dark:#c4560a; --rose:#8B5E4A;
  --green:#1a9e5c; --green-dim:#e5f7ee;
  --red:#d63b3b; --red-dim:#fbe7e7;
  --amber:#e8670a; --amber-dim:#fdf0e8;
  --blue:#1a6fd6; --blue-dim:#e6f0fc;
  --line:#e0e3ea; --muted:#7a8294;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
.font-display{font-weight:800;letter-spacing:-0.01em;}
.font-mono{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{display:none;}
#app{max-width:1100px;margin:0 auto;padding:0 20px 100px;}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.05);margin:0 -20px;padding-left:20px;padding-right:20px;}
header.top .brand{display:flex;align-items:center;gap:10px;}
header.top .mark{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px rgba(232,103,10,.4);}
header.top h1{font-size:16px;font-weight:700;letter-spacing:.2px;}
header.top .tag{font-size:10.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
nav.tabs{display:flex;gap:6px;margin:16px 0 22px;}
nav.tabs button{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--paper-dim);border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:9px 16px;white-space:nowrap;flex:0 0 auto;}
nav.tabs button.active{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);}
nav.tabs button:hover{color:var(--ink);}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
.grid{display:grid;gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:720px){.grid-3,.grid-2{grid-template-columns:1fr;}}
.stat{padding:16px 18px;}
.stat .num{font-size:30px;font-weight:800;line-height:1;letter-spacing:-0.02em;}
.stat .label{font-size:10.5px;color:var(--muted);margin-top:6px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;}
.stat.alert .num{color:var(--red);}
.stat.ok .num{color:var(--green);}
section.block{margin-bottom:28px;}
section.block > h2{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
section.block > h2 .btn-add{font-size:11px;font-weight:700;color:#fff;background:var(--amber);border:none;border-radius:6px;padding:6px 12px;cursor:pointer;text-transform:none;letter-spacing:0;}
section.block > h2 .btn-add:hover{background:var(--gold-dark);}
.wedding-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
.wedding-row:hover{border-color:var(--gold);}
.date-chip{font-size:12px;text-align:center;background:var(--paper-dim);border-radius:7px;padding:6px 9px;min-width:52px;line-height:1.2;}
.date-chip .d{font-size:16px;font-weight:600;display:block;}
.wedding-row .info{flex:1;min-width:0;}
.wedding-row .info .client{font-weight:600;font-size:14.5px;}
.wedding-row .info .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.progress-mini{font-size:11.5px;background:var(--paper-dim);padding:4px 8px;border-radius:6px;white-space:nowrap;}
.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.pill.not-started{background:var(--paper-dim);color:var(--muted);}
.pill.in-progress{background:var(--amber-dim);color:var(--amber);}
.pill.done{background:var(--green-dim);color:var(--green);}
.pill.delayed{background:var(--red-dim);color:var(--red);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;}
.overlay.show{display:block;}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--card);
  border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  max-height:86vh;overflow-y:auto;width:100%;max-width:640px;margin:0 auto;
  padding:10px 22px 26px;transform:translateY(100%);transition:transform .22s ease;}
.overlay.show .modal{transform:translateY(0);}
.modal::before{content:'';display:block;width:36px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 14px;}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;}
@media(min-width:640px){.overlay{display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}.overlay:not(.show){display:none;}.modal{position:static;border-radius:12px;transform:none;margin-top:20px;padding:22px;}.modal::before{display:none;}}
.field{margin-bottom:14px;}
.field label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--paper-dim);color:var(--ink);}
.field textarea{resize:vertical;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.staff-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;max-height:180px;overflow-y:auto;padding:2px;}
.staff-check{display:flex;align-items:center;gap:8px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px 9px;cursor:pointer;background:var(--paper-dim);}
.staff-check input{width:auto;}
.staff-check.freelancer{border-style:dashed;border-color:var(--blue);}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
.btn{font-weight:700;font-size:14px;padding:11px 18px;border-radius:9px;border:none;cursor:pointer;}
.btn-primary{background:var(--amber);color:#fff;}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--line);}
.btn-sm{padding:6px 11px;font-size:12px;}
.back-link{font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:14px;display:inline-block;}
.back-link:hover{color:var(--ink);}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.event-card{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--card);overflow:hidden;}
.event-card .ehead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none;gap:10px;}
.event-card .ehead-left{display:flex;align-items:center;gap:8px;min-width:0;}
.event-card .echev{font-size:11px;color:var(--muted);transition:transform .15s;flex-shrink:0;}
.event-card .echev.open{transform:rotate(90deg);}
.event-card .ename{font-weight:700;font-size:13.5px;white-space:nowrap;}
.event-card .edate{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.event-card .ebody{display:none;padding:0 14px 14px;border-top:1px solid var(--line);}
.event-card .ebody.open{display:block;padding-top:10px;}
.team-line{font-size:12.5px;color:var(--ink);margin-top:4px;}
.team-line b{color:var(--muted);font-weight:600;font-size:11px;margin-right:6px;}
.chip{display:inline-block;font-size:11.5px;background:var(--paper-dim);padding:3px 9px;border-radius:20px;margin:2px 3px 2px 0;}
.chip.freelancer{background:var(--blue-dim);color:var(--blue);}
.track-group{margin-bottom:18px;}
.track-group-title{font-size:10.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;}
.track-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:8px;flex-wrap:wrap;}
.track-row .tname{font-weight:600;font-size:13px;min-width:150px;flex:1;}
.track-row .tmeta{font-size:11px;color:var(--muted);}
.track-row select{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);}
.track-row input[type=date]{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);width:126px;}
.track-row input[type=text]{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);width:150px;}
.track-row a.link-out{font-size:11px;color:var(--blue);font-weight:600;}
.overall-progress{margin:10px 0 24px;}
.bar-track{height:7px;border-radius:5px;background:var(--paper-dim);overflow:hidden;}
.bar-fill{height:100%;background:var(--amber);border-radius:5px;transition:width .2s;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px;}
.dm-event-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--card);}
.dm-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line);}
.dm-row:last-child{border-bottom:none;}
.dm-row-label{width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:var(--muted);text-align:center;gap:2px;padding:8px 0;}
.dm-cells{display:flex;flex-wrap:wrap;flex:1;gap:0;}
.dm-cell{position:relative;flex:1 1 130px;max-width:200px;padding:12px 14px;cursor:pointer;border-right:1px solid rgba(255,255,255,.5);}
.dm-cell.pending{background:var(--red-dim);}
.dm-cell.copied{background:var(--green-dim);}
.dm-name{font-weight:700;font-size:12.5px;color:var(--ink);}
.dm-size{font-size:10.5px;margin-top:4px;color:var(--muted);opacity:.85;}
.dm-size-input{display:none;margin-top:4px;width:90px;font-size:11px;padding:3px 5px;border:1px solid rgba(0,0,0,.2);border-radius:5px;background:rgba(255,255,255,.8);}
.dm-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.15);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:16px;text-align:center;cursor:pointer;}
.dm-add{flex:1 1 100px;max-width:140px;display:flex;align-items:center;justify-content:center;padding:12px 10px;border:1px dashed var(--line);cursor:pointer;text-align:center;font-size:11.5px;color:var(--amber);font-weight:700;}
.fab{position:fixed;bottom:20px;right:18px;z-index:60;background:var(--amber);color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;box-shadow:0 4px 14px rgba(232,103,10,.35);border:none;cursor:pointer;}
.fev-box{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--card);}
.fev-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line);}
.fev-row:first-of-type{border-top:none;margin-top:8px;}
.fev-row select{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);}
.fev-row input[type=text]{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;background:var(--paper-dim);width:130px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

<script>
// ---------- Sample people data ----------
const OWNER = {id:'owner1', name:'Rahul Gauri', title:'Owner', accountRole:'owner', skills:[]};
const EMPLOYEES = [
  {id:'e1', name:'Aman Verma', title:'Lead Photographer', type:'inhouse', accountRole:'staff', skills:['still']},
  {id:'e2', name:'Rohit Sharma', title:'Candid Photographer', type:'inhouse', accountRole:'staff', skills:['still']},
  {id:'e3', name:'Neha Kapoor', title:'Candid Photographer', type:'inhouse', accountRole:'staff', skills:['still']},
  {id:'e4', name:'Vikram Rao', title:'Cinematographer', type:'inhouse', accountRole:'staff', skills:['cine']},
  {id:'e5', name:'Sameer Khan', title:'Drone Operator', type:'inhouse', accountRole:'staff', skills:['cine']},
  {id:'e6', name:'Divya Singh', title:'Photo Editor', type:'inhouse', accountRole:'staff', skills:['lightroom','photoshop']},
  {id:'e7', name:'Arjun Patel', title:'Video Editor', type:'inhouse', accountRole:'staff', skills:['teaser','instacut','story','reels','fullVideo']},
  {id:'e8', name:'Ritu Malhotra', title:'Delivery Manager', type:'inhouse', accountRole:'manager', skills:['videoBook']},
];
const FREELANCERS = [
  {id:'f1', name:'Manish Tiwari', title:'Candid Photographer', type:'freelancer'},
  {id:'f2', name:'Suresh Yadav', title:'Cinematographer', type:'freelancer'},
  {id:'f3', name:'Pooja Bhatt', title:'Photo Editor', type:'freelancer'},
  {id:'f4', name:'Deepak Joshi', title:'Video Editor', type:'freelancer'},
];
const ALL_PEOPLE = [...EMPLOYEES, ...FREELANCERS];
const ACCOUNTS = [OWNER, ...EMPLOYEES]; // freelancers have no login
function personName(id){ return id===OWNER.id ? OWNER.name : (ALL_PEOPLE.find(p=>p.id===id)?.name || id); }
function isFreelancer(id){ return FREELANCERS.some(p=>p.id===id); }
const ROLE_LABEL = {owner:'Owner', manager:'Manager', staff:'Staff'};
const SKILL_LABEL = {still:'Still Photography', cine:'Cinematography', lightroom:'Lightroom', photoshop:'Photoshop',
  teaser:'Teaser', instacut:'Insta-cut', story:'Wedding Story', reels:'Reels', fullVideo:'Full Video', videoBook:'Video Book'};
const ALL_SKILLS = Object.keys(SKILL_LABEL);
let currentUser = null; // set after login



const STATUS = ['not-started','in-progress','done'];
const STATUS_LABEL = {'not-started':'Not Started','in-progress':'In Progress','done':'Done'};
const DATA_STATUS = ['pending','copied'];

// ---------- Track definitions (all wedding-wide now) ----------
const WEDDING_TRACKS = [
  {key:'allPhotos', label:'All Photographs (watermarked, low-res)', platform:'Google Drive'},
  {key:'photoFrames', label:'Photo Frames', platform:''},
  {key:'videoBook', label:'Video Book', platform:'', defaultAssignee:'e8'},
  {key:'albumDesign', label:'Album Design', platform:''},
  {key:'albumUpload', label:'Album Upload', platform:'Google Drive'},
  {key:'printing', label:'Album Printing', platform:''},
  {key:'delivery', label:'Delivery to Client', platform:''},
  {key:'deliveryDone', label:'Delivery Done', platform:''},
];
// Video Editing sub-items (wedding-wide, single assignee each)
const VIDEO_EDITING_SINGLE = [
  {key:'teaser', label:'Teaser', platform:'Vimeo'},
  {key:'instacut', label:'Insta-cut', platform:'Vimeo'},
  {key:'story', label:'Wedding Story', platform:'Vimeo'},
  {key:'reels', label:'Reels', platform:'Vimeo'},
];

function newTrackObj(defaultAssignee){
  return {status:'not-started', assignee:defaultAssignee||'', start:'', due:'', link:''};
}
function newPhotoEditingObj(){
  return {
    lightroom: {status:'not-started', assignee:'', start:'', due:'', link:''},
    photoshop: {status:'not-started', assignee:'', start:'', due:''}
  };
}
function newVideoEditingObj(events){
  const fullVideo={};
  events.forEach(ev=> fullVideo[ev.id]=newTrackObj());
  const obj={fullVideo};
  VIDEO_EDITING_SINGLE.forEach(t=> obj[t.key]=newTrackObj());
  return obj;
}
function newDataManagementObj(events){
  return {hardDisks:[], events:{}}; // events[id].still/video = [{pid,status,dataSize}], lazy-initialized from event team
}
function weddingWideTracks(w){
  return {
    allPhotos:newTrackObj(), photoFrames:newTrackObj(), videoBook:newTrackObj('e8'),
    albumDesign:newTrackObj(), albumUpload:newTrackObj(), printing:newTrackObj(), delivery:newTrackObj(), deliveryDone:newTrackObj()
  };
}

// ---------- Sample weddings ----------
let WEDDINGS = [
  {
    id:'w1', client:'Karan & Simran', date:'2026-07-18',
    events:[
      {id:'ev1', name:'Mehendi', date:'2026-07-18', venue:'Farmhouse, Chattarpur', still:['e2'], cine:['e4']},
      {id:'ev2', name:'Sangeet', date:'2026-07-19', venue:'ITC Maurya', still:['e2','f1'], cine:['e4','f2']},
      {id:'ev3', name:'Wedding', date:'2026-07-20', venue:'ITC Maurya', still:['e1','e2','f1'], cine:['e4','e5']},
    ],
    photoEditing:newPhotoEditingObj(),
    videoEditing:null, // set below once events exist
    dataManagement:null,
    tracks: weddingWideTracks()
  }
];
WEDDINGS[0].videoEditing = newVideoEditingObj(WEDDINGS[0].events);
WEDDINGS[0].dataManagement = newDataManagementObj(WEDDINGS[0].events);
WEDDINGS[0].tracks.allPhotos.status='in-progress';
WEDDINGS[0].photoEditing.lightroom.status='done';
WEDDINGS[0].photoEditing.lightroom.assignee='e6';
WEDDINGS[0].dataManagement.hardDisks=['HD-01 Seagate'];
WEDDINGS[0].dataManagement.events['ev1']={still:[{pid:'e2', status:'copied', dataSize:'86 GB'}], video:[{pid:'e4', status:'pending', dataSize:''}]};

let currentTab='dashboard';
let currentWeddingId=null;

function genId(){ return 'w'+Math.random().toString(36).slice(2,9); }
function genEventId(){ return 'ev'+Math.random().toString(36).slice(2,9); }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function next30DayOptions(selected){
  let opts = `<option value="">—</option>`;
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<=30;i++){
    const d=new Date(today); d.setDate(d.getDate()+i);
    const iso=d.toISOString().slice(0,10);
    const label=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    opts += `<option value="${iso}" ${selected===iso?'selected':''}>${label}</option>`;
  }
  if(selected && !opts.includes(`value="${selected}"`)){
    opts += `<option value="${selected}" selected>${fmtDate(selected)} (past)</option>`;
  }
  return opts;
}
function dateChip(d){ const dt=new Date(d+'T00:00:00'); return {day:dt.getDate(), mon:dt.toLocaleDateString('en-IN',{month:'short'})}; }

// ---------- progress calc ----------
function allTracksOf(w){
  let list=[];
  WEDDING_TRACKS.forEach(t=> list.push(w.tracks[t.key]));
  list.push(w.photoEditing.lightroom, w.photoEditing.photoshop);
  VIDEO_EDITING_SINGLE.forEach(t=> list.push(w.videoEditing[t.key]));
  w.events.forEach(ev=> list.push(w.videoEditing.fullVideo[ev.id]));
  return list;
}
function progressOf(w){
  const list=allTracksOf(w);
  const done=list.filter(t=>t.status==='done').length;
  return {done, total:list.length, pct: list.length? Math.round(done/list.length*100):0};
}
function isDelayed(t){
  if(!t.due || t.status==='done') return false;
  return new Date(t.due) < new Date(new Date().toDateString());
}

// ---------- Render shell ----------
function render(){
  if(!currentUser){ renderLogin(); return; }
  const isOwner = currentUser.accountRole==='owner';
  const isManager = currentUser.accountRole==='manager';
  const isStaff = currentUser.accountRole==='staff';
  document.getElementById('app').innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="mark"></div>
        <div><h1>Fotovision ERM</h1><div class="tag">${currentUser.name.toUpperCase()} · ${ROLE_LABEL[currentUser.accountRole].toUpperCase()}</div></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Switch User</button>
    </header>
    <nav class="tabs">
      ${isStaff ? tabBtn('mytasks','My Tasks') : ''}
      ${!isStaff ? tabBtn('dashboard','Dashboard') : ''}
      ${!isStaff ? tabBtn('weddings','Weddings') : ''}
      ${isOwner ? tabBtn('settings','Settings') : ''}
    </nav>
    <div id="tabContent"></div>
    ${!isStaff ? `<button class="fab" id="fabBtn" onclick="handleFab()">+</button>` : ''}
  `;
  renderTab();
}
function logout(){ currentUser=null; currentTab='dashboard'; currentWeddingId=null; render(); }
function renderLogin(){
  document.getElementById('app').innerHTML = `
    <header class="top"><div class="brand"><div class="mark"></div><div><h1>Fotovision ERM</h1><div class="tag">SIGN IN</div></div></div></header>
    <section class="block" style="margin-top:20px;">
      <h2>Owner</h2>
      <div class="wedding-row" onclick="loginAs('${OWNER.id}')"><div class="info"><div class="client">${OWNER.name}</div><div class="meta">Full access</div></div><span class="pill done">Owner</span></div>
    </section>
    <section class="block">
      <h2>Manager</h2>
      ${EMPLOYEES.filter(p=>p.accountRole==='manager').map(p=>`
        <div class="wedding-row" onclick="loginAs('${p.id}')"><div class="info"><div class="client">${p.name}</div><div class="meta">${p.title}</div></div><span class="pill in-progress">Manager</span></div>
      `).join('')}
    </section>
    <section class="block">
      <h2>Staff</h2>
      ${EMPLOYEES.filter(p=>p.accountRole==='staff').map(p=>`
        <div class="wedding-row" onclick="loginAs('${p.id}')"><div class="info"><div class="client">${p.name}</div><div class="meta">${p.title}</div></div><span class="pill not-started">Staff</span></div>
      `).join('')}
    </section>
  `;
}
function loginAs(id){
  currentUser = id===OWNER.id ? OWNER : EMPLOYEES.find(p=>p.id===id);
  currentTab = currentUser.accountRole==='staff' ? 'mytasks' : 'dashboard';
  render();
}
function handleFab(){
  if(currentWeddingId) openEventModal(currentWeddingId);
  else openWeddingModal();
}
function tabBtn(id,label){ return `<button class="${currentTab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`; }
function setTab(id){ currentTab=id; currentWeddingId=null; renderTab(); }
function renderTab(){
  const el=document.getElementById('tabContent');
  if(currentTab==='dashboard') el.innerHTML=renderDashboard();
  else if(currentTab==='mytasks') el.innerHTML=renderMyTasks();
  else if(currentTab==='settings') el.innerHTML=renderSettings();
  else el.innerHTML = currentWeddingId ? renderWeddingDetail(currentWeddingId) : renderWeddingsList();
}

// ---------- My Tasks (staff view) ----------
function collectAssignedItems(personId){
  const items=[];
  WEDDINGS.forEach(w=>{
    if(w.photoEditing.lightroom.assignee===personId) items.push({w, label:'Lightroom — Photo Editing', track:w.photoEditing.lightroom});
    if(w.photoEditing.photoshop.assignee===personId) items.push({w, label:'Photoshop — Photo Editing', track:w.photoEditing.photoshop});
    VIDEO_EDITING_SINGLE.forEach(t=>{ if(w.videoEditing[t.key].assignee===personId) items.push({w, label:t.label+' — Video Editing', track:w.videoEditing[t.key]}); });
    w.events.forEach(ev=>{ if(w.videoEditing.fullVideo[ev.id].assignee===personId) items.push({w, label:ev.name+' — Full Video', track:w.videoEditing.fullVideo[ev.id]}); });
    WEDDING_TRACKS.forEach(t=>{ if(w.tracks[t.key].assignee===personId) items.push({w, label:t.label, track:w.tracks[t.key]}); });
  });
  return items;
}
function renderMyTasks(){
  const items=collectAssignedItems(currentUser.id);
  const pending=items.filter(i=>i.track.status!=='done');
  const done=items.filter(i=>i.track.status==='done');
  return `
    <section class="block">
      <h2>Assigned To Me</h2>
      ${pending.map(renderMyTaskRow).join('') || emptyState('Nothing assigned to you right now')}
    </section>
    ${done.length?`<section class="block"><h2>Completed</h2>${done.map(renderMyTaskRow).join('')}</section>`:''}
  `;
}
function renderMyTaskRow(item){
  const delayed=isDelayed(item.track);
  const statusCls = delayed ? 'delayed' : item.track.status;
  const statusText = delayed ? 'Delayed' : STATUS_LABEL[item.track.status];
  return `
    <div class="track-row">
      <span class="pill ${statusCls}">${statusText}</span>
      <span class="tname">${item.label} <span class="tmeta">— ${item.w.client}</span></span>
      <select onchange="updateMyTask('${item.w.id}','${item.label}',this.value)">
        ${STATUS.map(s=>`<option value="${s}" ${item.track.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
      </select>
      ${item.track.due?`<span class="tmeta">due ${fmtDate(item.track.due)}</span>`:''}
    </div>
  `;
}
function updateMyTask(weddingId, label, value){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const items=collectAssignedItems(currentUser.id).filter(i=>i.w.id===weddingId && i.label===label);
  if(items.length) items[0].track.status=value;
  renderTab();
}

// ---------- Settings (owner only): staff directory ----------
function renderSettings(){
  return `
    <section class="block">
      <h2>Staff Directory <button class="btn-add" onclick="openStaffModal()">+ Add Staff</button></h2>
      ${EMPLOYEES.map(p=>`
        <div class="wedding-row" onclick="openStaffModal('${p.id}')">
          <div class="info">
            <div class="client">${p.name}</div>
            <div class="meta">${p.title} · ${(p.skills||[]).map(s=>SKILL_LABEL[s]).join(', ')||'no skills tagged'}</div>
          </div>
          <span class="pill ${p.accountRole==='owner'?'done':p.accountRole==='manager'?'in-progress':'not-started'}">${ROLE_LABEL[p.accountRole]}</span>
        </div>
      `).join('')}
    </section>
    <section class="block">
      <h2>Freelancers <span class="tmeta">(no login — assignable only)</span></h2>
      ${FREELANCERS.map(p=>`
        <div class="wedding-row" style="cursor:default;">
          <div class="info"><div class="client">${p.name}</div><div class="meta">${p.title}</div></div>
        </div>
      `).join('')}
    </section>
  `;
}
function openStaffModal(personId){
  const p = personId ? EMPLOYEES.find(x=>x.id===personId) : null;
  document.getElementById('modalBody').innerHTML = `
    <h3>${p?'Edit Staff':'Add Staff'}</h3>
    <div class="row2">
      <div class="field"><label>Name</label><input id="f_stName" value="${p?p.name:''}"></div>
      <div class="field"><label>Job Title</label><input id="f_stTitle" value="${p?p.title:''}" placeholder="e.g. Photo Editor"></div>
    </div>
    <div class="field">
      <label>Account Role</label>
      <select id="f_stRole">
        <option value="staff" ${p&&p.accountRole==='staff'?'selected':''}>Staff — sees only own tasks</option>
        <option value="manager" ${p&&p.accountRole==='manager'?'selected':''}>Manager — builds teams, manages data</option>
        <option value="owner" ${p&&p.accountRole==='owner'?'selected':''}>Owner — full access</option>
      </select>
    </div>
    <div class="field">
      <label>Skills (what work they can be assigned)</label>
      <div class="staff-check-grid">
        ${ALL_SKILLS.map(s=>`<label class="staff-check"><input type="checkbox" value="${s}" class="skillbox" ${p&&(p.skills||[]).includes(s)?'checked':''}> ${SKILL_LABEL[s]}</label>`).join('')}
      </div>
    </div>
    <div class="modal-actions">
      ${p?`<button class="btn btn-ghost" style="color:var(--red);" onclick="deleteStaff('${p.id}')">Remove</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveStaff('${personId||''}')">Save</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function saveStaff(personId){
  const name=document.getElementById('f_stName').value.trim();
  const title=document.getElementById('f_stTitle').value.trim();
  const accountRole=document.getElementById('f_stRole').value;
  const skills=[...document.querySelectorAll('.skillbox:checked')].map(c=>c.value);
  if(!name){ alert('Name is required'); return; }
  if(personId){
    const p=EMPLOYEES.find(x=>x.id===personId);
    p.name=name; p.title=title; p.accountRole=accountRole; p.skills=skills;
  } else {
    EMPLOYEES.push({id:'e'+Math.random().toString(36).slice(2,9), name, title, type:'inhouse', accountRole, skills});
  }
  closeModal();
  renderTab();
}
function deleteStaff(personId){
  const idx=EMPLOYEES.findIndex(x=>x.id===personId);
  if(idx>-1) EMPLOYEES.splice(idx,1);
  closeModal();
  renderTab();
}

// ---------- Dashboard ----------
function renderDashboard(){
  const active = WEDDINGS.length;
  let delayedCount=0, pendingTracks=0;
  WEDDINGS.forEach(w=> allTracksOf(w).forEach(t=>{ if(isDelayed(t)) delayedCount++; if(t.status!=='done') pendingTracks++; }));
  return `
    <section class="block">
      <div class="grid grid-3">
        <div class="card stat"><div class="num font-mono">${active}</div><div class="label">ACTIVE WEDDINGS</div></div>
        <div class="card stat ok"><div class="num font-mono">${pendingTracks}</div><div class="label">TRACKS PENDING</div></div>
        <div class="card stat alert"><div class="num font-mono">${delayedCount}</div><div class="label">DELAYED TRACKS</div></div>
      </div>
    </section>
    <section class="block">
      <h2>Weddings</h2>
      ${WEDDINGS.map(renderWeddingRow).join('') || emptyState('No weddings yet')}
    </section>
  `;
}

// ---------- Weddings list ----------
function renderWeddingsList(){
  return `
    <section class="block">
      <h2>All Weddings <button class="btn-add" onclick="openWeddingModal()">+ New Wedding</button></h2>
      ${WEDDINGS.map(renderWeddingRow).join('') || emptyState('No weddings yet. Add your first one.')}
    </section>
  `;
}
function renderWeddingRow(w){
  const chip=dateChip(w.date);
  const p=progressOf(w);
  const hasDelay = allTracksOf(w).some(isDelayed);
  return `
    <div class="wedding-row" onclick="openWeddingDetail('${w.id}')">
      <div class="date-chip"><span class="d">${chip.day}</span>${chip.mon}</div>
      <div class="info">
        <div class="client">${w.client}</div>
        <div class="meta">${w.events.length} events · ${fmtDate(w.date)}</div>
      </div>
      <div class="progress-mini">${p.done}/${p.total} tracks done</div>
      ${hasDelay ? `<span class="pill delayed">DELAYED</span>` : `<span class="pill ${p.pct===100?'done':'in-progress'}">${p.pct}%</span>`}
    </div>
  `;
}

function closeWeddingDetail(){ currentWeddingId=null; renderTab(); }

  if(!w) return emptyState('Wedding not found');

  return `
    <span class="back-link" onclick="closeWeddingDetail()">&larr; back to weddings</span>
    <div class="detail-header">
      <div>
        <h2 class="font-display" style="font-size:22px;">${w.client}</h2>
        <div style="color:var(--muted);font-size:13px;margin-top:4px;">${fmtDate(w.date)} · ${w.events.length} events</div>
      </div>
      <button class="btn btn-ghost" onclick="deleteWedding('${w.id}')">Delete Wedding</button>
    </div>
    <div class="overall-progress">
      <div class="bar-track"><div class="bar-fill" style="width:${p.pct}%"></div></div>

          <span class="echev" id="chev_${ev.id}">▶</span>
          <span class="ename">${ev.name}</span>

        <div class="team-line"><b>STILL</b>${ev.still.map(pid=>`<span class="chip ${isFreelancer(pid)?'freelancer':''}">${personName(pid)}</span>`).join('') || '<span style="color:var(--muted);">unassigned</span>'}</div>
        <div class="team-line"><b>CINE</b>${ev.cine.map(pid=>`<span class="chip ${isFreelancer(pid)?'freelancer':''}">${personName(pid)}</span>`).join('') || '<span style="color:var(--muted);">unassigned</span>'}</div>

function toggleEventCard(eventId){
  const body=document.getElementById('body_'+eventId);
  const chev=document.getElementById('chev_'+eventId);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

// ---------- Photo Editing (Lightroom -> Photoshop, sequential) ----------
function renderPhotoEditingRow(w, subKey, label, hasLink){
  const track = w.photoEditing[subKey];
  const locked = subKey==='photoshop' && w.photoEditing.lightroom.status!=='done';
  const delayed = isDelayed(track);
  const statusCls = delayed ? 'delayed' : track.status;
  const statusText = delayed ? 'Delayed' : STATUS_LABEL[track.status];
  return `
    <div class="track-row" style="${locked?'opacity:.5;':''}">
      <span class="pill ${statusCls}">${statusText}</span>
      <span class="tname">${label}${hasLink?' <span class="tmeta">(FotoOwl)</span>':''}${locked?' <span class="tmeta">— waiting on Lightroom</span>':''}</span>
      <select ${locked?'disabled':''} onchange="updatePhotoEditing('${w.id}','${subKey}','status',this.value)">
        ${STATUS.map(s=>`<option value="${s}" ${track.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
      </select>
      <select ${locked?'disabled':''} onchange="updatePhotoEditing('${w.id}','${subKey}','assignee',this.value)">
        <option value="">Assign to...</option>
        ${ALL_PEOPLE.map(p=>`<option value="${p.id}" ${track.assignee===p.id?'selected':''}>${p.name}${p.type==='freelancer'?' (freelancer)':''}</option>`).join('')}
      </select>
      <select ${locked?'disabled':''} onchange="updatePhotoEditing('${w.id}','${subKey}','start',this.value)" title="Start Date">
        ${next30DayOptions(track.start)}
      </select>
      <select ${locked?'disabled':''} onchange="updatePhotoEditing('${w.id}','${subKey}','due',this.value)" title="Due Date">
        ${next30DayOptions(track.due)}
      </select>
      ${hasLink?`<input type="text" ${locked?'disabled':''} placeholder="paste FotoOwl link" value="${track.link||''}" onchange="updatePhotoEditing('${w.id}','${subKey}','link',this.value)">
      ${track.link ? `<a class="link-out" href="${track.link}" target="_blank" rel="noopener">open ↗</a>` : ''}`:''}
    </div>
  `;
}
function updatePhotoEditing(weddingId, subKey, field, value){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.photoEditing[subKey][field]=value;
  renderTab();
}

// ---------- Generic wedding-wide / video-editing tracks ----------
function renderTrackRow(weddingId, trackDef, track, ref){
  const delayed = isDelayed(track);
  const statusCls = delayed ? 'delayed' : track.status;
  const statusText = delayed ? 'Delayed' : STATUS_LABEL[track.status];
  const refStr = encodeURIComponent(JSON.stringify(ref));
  return `
    <div class="track-row">
      <span class="pill ${statusCls}">${statusText}</span>
      <span class="tname">${trackDef.label}${trackDef.platform?` <span class="tmeta">(${trackDef.platform})</span>`:''}</span>
      <select onchange="updateTrack('${weddingId}','${refStr}','status',this.value)">
        ${STATUS.map(s=>`<option value="${s}" ${track.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
      </select>
      <select onchange="updateTrack('${weddingId}','${refStr}','assignee',this.value)">
        <option value="">Assign to...</option>
        ${ALL_PEOPLE.map(p=>`<option value="${p.id}" ${track.assignee===p.id?'selected':''}>${p.name}${p.type==='freelancer'?' (freelancer)':''}</option>`).join('')}
      </select>
      <select onchange="updateTrack('${weddingId}','${refStr}','start',this.value)" title="Start Date">
        ${next30DayOptions(track.start)}
      </select>
      <select onchange="updateTrack('${weddingId}','${refStr}','due',this.value)" title="Due Date">
        ${next30DayOptions(track.due)}
      </select>
      <input type="text" placeholder="paste link" value="${track.link}" onchange="updateTrack('${weddingId}','${refStr}','link',this.value)">
      ${track.link ? `<a class="link-out" href="${track.link}" target="_blank" rel="noopener">open ↗</a>` : ''}
    </div>
  `;
}
// ---------- Full Event Video: one box, all events listed inside ----------
function renderFullVideoBox(w){
  if(!w.events.length) return emptyState('Add events first');
  return `
    <div class="fev-box">
      <div class="track-group-title" style="margin-bottom:2px;">Full Event Video <span class="tmeta">(Google Drive)</span></div>
      ${w.events.map(ev=>{
        const track=w.videoEditing.fullVideo[ev.id];
        const delayed=isDelayed(track);
        const statusCls = delayed ? 'delayed' : track.status;
        const statusText = delayed ? 'Delayed' : STATUS_LABEL[track.status];
        const ref=encodeURIComponent(JSON.stringify({kind:'fullVideo', eventId:ev.id}));
        return `
          <div class="fev-row">
            <span class="pill ${statusCls}">${statusText}</span>
            <span class="tname">${ev.name}</span>
            <select onchange="updateTrack('${w.id}','${ref}','status',this.value)">
              ${STATUS.map(s=>`<option value="${s}" ${track.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}
            </select>
            <select onchange="updateTrack('${w.id}','${ref}','assignee',this.value)">
              <option value="">Assign to...</option>
              ${ALL_PEOPLE.map(p=>`<option value="${p.id}" ${track.assignee===p.id?'selected':''}>${p.name}${p.type==='freelancer'?' (freelancer)':''}</option>`).join('')}
            </select>
            <select onchange="updateTrack('${w.id}','${ref}','start',this.value)" title="Start Date">${next30DayOptions(track.start)}</select>
            <select onchange="updateTrack('${w.id}','${ref}','due',this.value)" title="Due Date">${next30DayOptions(track.due)}</select>
            <input type="text" placeholder="paste link" value="${track.link}" onchange="updateTrack('${w.id}','${ref}','link',this.value)">
          </div>
        `;
      }).join('')}
    </div>
  `;
}
function getTrackByRef(w, ref){
  if(ref.kind==='wedding') return w.tracks[ref.trackKey];
  if(ref.kind==='videoEditingSingle') return w.videoEditing[ref.trackKey];
  if(ref.kind==='fullVideo') return w.videoEditing.fullVideo[ref.eventId];
}
function updateTrack(weddingId, refStr, field, value){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  if(!w) return;
  const ref=JSON.parse(decodeURIComponent(refStr));
  const track=getTrackByRef(w, ref);
  track[field]=value;
  renderTab();
}

// ---------- Data Management (mirrors attendance app: auto-fills from event team, colored cells, tap to toggle, + Add for extra people) ----------
function ensureDmInit(w, ev){
  if(!w.dataManagement.events[ev.id]){
    w.dataManagement.events[ev.id] = {
      still: ev.still.map(pid=>({pid, status:'pending', dataSize:''})),
      video: ev.cine.map(pid=>({pid, status:'pending', dataSize:''}))
    };
  }
}
function renderDataManagement(w){
  const dm=w.dataManagement;
  return `
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Hard Disks Assigned</div>
      <div class="assign-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
        ${dm.hardDisks.map((d,i)=>`<span class="chip">💾 ${d} <span style="cursor:pointer;color:var(--red);" onclick="removeHardDisk('${w.id}',${i})">×</span></span>`).join('') || '<span style="color:var(--muted);font-size:12.5px;">No disks assigned yet</span>'}
      </div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="newHdInput_${w.id}" placeholder="e.g. HD-04 Seagate 2TB" style="flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper-dim);font-size:13px;">
        <button class="btn btn-primary btn-sm" onclick="addHardDisk('${w.id}')">Add Disk</button>
      </div>
    </div>
    ${w.events.map(ev=>{
      ensureDmInit(w, ev);
      return `
        <div class="dm-event-card">
          <div class="track-group-title" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
            <span>${fmtDate(ev.date)} — ${ev.name} <span style="color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;">· ${ev.venue||'venue TBD'}</span></span>
            <span style="color:var(--amber);cursor:pointer;font-weight:700;text-transform:none;letter-spacing:0;" onclick="openEventModal('${w.id}','${ev.id}')">Edit</span>
          </div>
          ${renderDmFlexRow(w, ev, 'still', '📷', 'Still')}
          ${renderDmFlexRow(w, ev, 'video', '🎬', 'Video')}
        </div>
      `;
    }).join('') || emptyState('Add events first to track their data copy status')}
  `;
}
function renderDmFlexRow(w, ev, cat, icon, label){
  const list=w.dataManagement.events[ev.id][cat];
  const cells=list.map((entry,i)=>{
    const cellId=`dmsize_${w.id}_${ev.id}_${cat}_${i}`;
    return `
      <div class="dm-cell ${entry.status}" onclick="toggleDmStatus('${w.id}','${ev.id}','${cat}',${i})">
        <span class="dm-remove" onclick="event.stopPropagation();removeDmPerson('${w.id}','${ev.id}','${cat}',${i})">×</span>
        <div class="dm-name">${personName(entry.pid)}</div>
        <div class="dm-size" id="${cellId}_display" onclick="event.stopPropagation();openDmSizeInput('${cellId}','${w.id}','${ev.id}','${cat}',${i})">${entry.dataSize||'+ size'}</div>
        <input type="text" class="dm-size-input" id="${cellId}_input" placeholder="e.g. 120 GB" value="${entry.dataSize}"
          onclick="event.stopPropagation()"
          onblur="saveDmSize('${cellId}','${w.id}','${ev.id}','${cat}',${i},this.value)"
          onkeydown="if(event.key==='Enter')this.blur()">
      </div>`;
  }).join('');
  return `
    <div class="dm-row">
      <div class="dm-row-label">${icon}<br>${label}</div>
      <div class="dm-cells">
        ${cells}
        <div class="dm-add" onclick="openAddDmPerson('${w.id}','${ev.id}','${cat}')">+ Add</div>
      </div>
    </div>
  `;
}
function openDmSizeInput(cellId){
  document.getElementById(cellId+'_display').style.display='none';
  const inp=document.getElementById(cellId+'_input');
  inp.style.display='block';
  inp.focus();
}
function saveDmSize(cellId, weddingId, eventId, cat, idx, value){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.dataManagement.events[eventId][cat][idx].dataSize=value;
  renderTab();
}
function toggleDmStatus(weddingId, eventId, cat, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const entry=w.dataManagement.events[eventId][cat][idx];
  entry.status = entry.status==='copied' ? 'pending' : 'copied';
  renderTab();
}
function removeDmPerson(weddingId, eventId, cat, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const entry=w.dataManagement.events[eventId][cat][idx];
  document.getElementById('modalBody').innerHTML = `
    <h3>Remove ${personName(entry.pid)}?</h3>
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:6px;">This removes them from the ${cat==='still'?'Still':'Video'} data tracking for this event${entry.dataSize?` — recorded size (${entry.dataSize}) will be lost.`:'.'}</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="background:var(--red);" onclick="confirmRemoveDmPerson('${weddingId}','${eventId}','${cat}',${idx})">Remove</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function confirmRemoveDmPerson(weddingId, eventId, cat, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.dataManagement.events[eventId][cat].splice(idx,1);
  closeModal();
  renderTab();
}
function openAddDmPerson(weddingId, eventId, cat){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const already=w.dataManagement.events[eventId][cat].map(e=>e.pid);
  const options=ALL_PEOPLE.filter(p=>!already.includes(p.id));
  document.getElementById('modalBody').innerHTML = `
    <h3>Add Person — ${cat==='still'?'Still':'Video'} Data</h3>
    <div class="field">
      <label>Select Person</label>
      <select id="f_dmPerson">
        ${options.map(p=>`<option value="${p.id}">${p.name}${p.type==='freelancer'?' (freelancer)':''}</option>`).join('') || '<option value="">No one left to add</option>'}
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAddDmPerson('${weddingId}','${eventId}','${cat}')">Add</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function saveAddDmPerson(weddingId, eventId, cat){
  const pid=document.getElementById('f_dmPerson').value;
  if(!pid) { closeModal(); return; }
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.dataManagement.events[eventId][cat].push({pid, status:'pending', dataSize:''});
  closeModal();
  renderTab();
}
function addHardDisk(weddingId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const inp=document.getElementById('newHdInput_'+weddingId);
  const name=inp.value.trim();
  if(!name) return;
  w.dataManagement.hardDisks.push(name);
  renderTab();
}
function removeHardDisk(weddingId, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.dataManagement.hardDisks.splice(idx,1);
  renderTab();
}

function deleteWedding(id){
  WEDDINGS=WEDDINGS.filter(x=>x.id!==id);
  currentWeddingId=null;
  renderTab();
}

function emptyState(msg){ return `<div class="empty">${msg}</div>`; }

// ---------- New wedding modal ----------
function openWeddingModal(){
  document.getElementById('modalBody').innerHTML = `
    <h3>New Wedding Booking</h3>
    <div class="field"><label>Client Names</label><input id="f_client" placeholder="e.g. Karan & Simran"></div>
    <div class="field"><label>Wedding Date</label><input id="f_date" type="date"></div>
    <div style="font-size:12px;color:var(--muted);margin:6px 0 4px;">You can add events (Mehendi, Sangeet, Wedding, Reception etc.) after creating the wedding.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewWedding()">Create Wedding</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function saveNewWedding(){
  const client=document.getElementById('f_client').value.trim();
  const date=document.getElementById('f_date').value;
  if(!client||!date){ alert('Client name and date are required'); return; }
  const w={
    id:genId(), client, date, events:[],
    photoEditing:newPhotoEditingObj(),
    videoEditing:newVideoEditingObj([]),
    dataManagement:newDataManagementObj([]),
    tracks:weddingWideTracks()
  };
  WEDDINGS.push(w);
  closeModal();
  currentWeddingId=w.id;
  renderTab();
}

// ---------- Event modal (add/edit team) ----------
function personCheckboxes(selected){
  return `
    <div class="staff-check-grid">
      ${EMPLOYEES.map(p=>`<label class="staff-check"><input type="checkbox" value="${p.id}" ${selected.includes(p.id)?'checked':''}> ${p.name} <span style="color:var(--muted);font-size:10.5px;">(${p.title})</span></label>`).join('')}
      ${FREELANCERS.map(p=>`<label class="staff-check freelancer"><input type="checkbox" value="${p.id}" ${selected.includes(p.id)?'checked':''}> ${p.name} <span style="color:var(--blue);font-size:10.5px;">(freelancer · ${p.title})</span></label>`).join('')}
    </div>
  `;
}
function openEventModal(weddingId, eventId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const ev = eventId ? w.events.find(e=>e.id===eventId) : null;
  document.getElementById('modalBody').innerHTML = `
    <h3>${ev?'Edit Event':'Add Event'} — ${w.client}</h3>
    <div class="row2">
      <div class="field"><label>Event Name</label><input id="f_ename" placeholder="e.g. Sangeet" value="${ev?ev.name:''}"></div>
      <div class="field"><label>Date</label><input id="f_edate" type="date" value="${ev?ev.date:''}"></div>
    </div>
    <div class="field"><label>Venue</label><input id="f_evenue" placeholder="e.g. ITC Maurya" value="${ev?ev.venue:''}"></div>
    <div class="field"><label>Still Photography Team</label>${personCheckboxes(ev?ev.still:[]).replace('staff-check-grid','staff-check-grid still-grid')}</div>
    <div class="field"><label>Cinematography Team</label>${personCheckboxes(ev?ev.cine:[]).replace('staff-check-grid','staff-check-grid cine-grid')}</div>
    <div class="modal-actions">
      ${ev?`<button class="btn btn-ghost" style="color:var(--red);" onclick="deleteEvent('${weddingId}','${eventId}')">Delete Event</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEvent('${weddingId}','${eventId||''}')">Save Event</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function saveEvent(weddingId, eventId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const name=document.getElementById('f_ename').value.trim();
  const date=document.getElementById('f_edate').value;
  const venue=document.getElementById('f_evenue').value.trim();
  const still=[...document.querySelectorAll('.still-grid input:checked')].map(c=>c.value);
  const cine=[...document.querySelectorAll('.cine-grid input:checked')].map(c=>c.value);
  if(!name||!date){ alert('Event name and date are required'); return; }
  if(eventId){
    const ev=w.events.find(e=>e.id===eventId);
    ev.name=name; ev.date=date; ev.venue=venue; ev.still=still; ev.cine=cine;
    syncDmWithTeam(w, ev);
  } else {
    const newEvId=genEventId();
    w.events.push({id:newEvId, name, date, venue, still, cine});
    w.videoEditing.fullVideo[newEvId]=newTrackObj();
    // dataManagement auto-initializes from event team on first render (see ensureDmInit)
  }
  closeModal();
  renderTab();
}
// Keep Data Management in sync when the team is edited later — adds newly-checked people
// without touching status/size already recorded for people still on the team.
function syncDmWithTeam(w, ev){
  ensureDmInit(w, ev);
  const dm=w.dataManagement.events[ev.id];
  ev.still.forEach(pid=>{ if(!dm.still.some(e=>e.pid===pid)) dm.still.push({pid, status:'pending', dataSize:''}); });
  ev.cine.forEach(pid=>{ if(!dm.video.some(e=>e.pid===pid)) dm.video.push({pid, status:'pending', dataSize:''}); });
}
function deleteEvent(weddingId, eventId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.events=w.events.filter(e=>e.id!==eventId);
  delete w.videoEditing.fullVideo[eventId];
  Object.keys(w.dataManagement.events).forEach(k=>{ if(k===eventId) delete w.dataManagement.events[k]; });
  closeModal();
  renderTab();
}

function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click',(ev)=>{ if(ev.target.id==='overlay') closeModal(); });

Object.assign(window,{setTab, openWeddingDetail, closeWeddingDetail, openWeddingModal, saveNewWedding,
  openEventModal, saveEvent, deleteEvent, updateTrack, updatePhotoEditing, deleteWedding, closeModal,
  addHardDisk, removeHardDisk, toggleDmStatus, openDmSizeInput, saveDmSize, removeDmPerson, openAddDmPerson, saveAddDmPerson, handleFab, toggleEventCard,
  logout, loginAs, updateMyTask, openStaffModal, saveStaff, deleteStaff, confirmRemoveDmPerson});

render();
</script>
