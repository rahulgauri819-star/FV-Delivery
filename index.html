        <div class="dm-event-card">
          <div class="track-group-title" style="margin-bottom:0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="toggleDmEventCard('${ev.id}')">
            <span style="display:flex;align-items:center;gap:8px;">
              <span class="echev${open?' open':''}" style="font-size:11px;color:var(--muted);transition:transform .15s;">&#9654;</span>
              ${fmtDate(ev.date)} — ${esc(ev.name)}
            </span>
            <span style="display:flex;gap:12px;align-items:center;">
              <span style="color:var(--amber);cursor:pointer;font-weight:700;text-transform:none;letter-spacing:0;font-size:12.5px;" onclick="event.stopPropagation();duplicateEvent('${w.id}','${ev.id}')">Duplicate</span>
              <span style="color:var(--amber);cursor:pointer;font-weight:700;text-transform:none;letter-spacing:0;font-size:12.5px;" onclick="event.stopPropagation();openEventModal('${w.id}','${ev.id}')">Edit</span>
            </span>
          </div>
          ${open ? `
            <div style="margin-top:10px;">
              ${renderDmFlexRow(w, ev, 'still', '📷', 'Still')}
              ${renderDmFlexRow(w, ev, 'video', '🎬', 'Video')}
            </div>
          ` : ''}
        </div>
      `;
    }).join('') || emptyState('Add events first to track their data copy status')}
    <button class="btn-add" style="margin-top:12px;display:block;" onclick="openEventModal('${w.id}')">+ Add Event</button>
  `;
}
function renderDmFlexRow(w, ev, cat, icon, label){
  const list=w.dataManagement.events[ev.id][cat];
  const cells=list.map((entry,i)=>{
    const cellId=`dmsize_${w.id}_${ev.id}_${cat}_${i}`;
    return `
      <div class="dm-cell ${entry.status}" onclick="toggleDmStatus('${w.id}','${ev.id}','${cat}',${i})">
        <span class="dm-remove" onclick="event.stopPropagation();removeDmPerson('${w.id}','${ev.id}','${cat}',${i})">×</span>
        <div class="dm-name">${esc(personName(entry.pid))}</div>
        <div class="dm-size" id="${cellId}_display" onclick="event.stopPropagation();openDmSizeInput('${cellId}','${w.id}','${ev.id}','${cat}',${i})">${esc(entry.dataSize)||'+ size'}</div>
        <input type="text" class="dm-size-input" id="${cellId}_input" placeholder="e.g. 120 GB" value="${esc(entry.dataSize)}"
          onclick="event.stopPropagation()"
          onblur="saveDmSize('${cellId}','${w.id}','${ev.id}','${cat}',${i},this.value)"
          onkeydown="if(event.key==='Enter')this.blur()">
      </div>`;
  }).join('');
  return `
    <div class="dm-row">
      <div class="dm-row-label">${icon}<br>${label}</div>
      <div class="dm-cells">
        ${cells}
        <div class="dm-add" onclick="openAddDmPerson('${w.id}','${ev.id}','${cat}')">+ Add</div>
      </div>
    </div>
  `;
}
function openDmSizeInput(cellId){
  document.getElementById(cellId+'_display').style.display='none';
  const inp=document.getElementById(cellId+'_input');
  inp.style.display='block';
  inp.focus();
}
function saveDmSize(cellId, weddingId, eventId, cat, idx, value){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.dataManagement.events[eventId][cat][idx].dataSize=value;
  renderTab();
}
function toggleDmStatus(weddingId, eventId, cat, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const entry=w.dataManagement.events[eventId][cat][idx];
  const name=personName(entry.pid);
  if(entry.status==='pending'){
    // Red → Green: confirm data has been copied
    document.getElementById('modalBody').innerHTML=`
      <h3 style="margin-bottom:12px;">Mark as Copied?</h3>
      <p style="font-size:13.5px;color:var(--muted);margin-bottom:20px;">Has <b>${esc(name)}</b>'s data been copied?</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Not Yet</button>
        <button class="btn btn-primary" onclick="confirmDmStatus('${weddingId}','${eventId}','${cat}',${idx},'copied')">Yes, Copied</button>
      </div>`;
  } else {
    // Green → Red: confirm undo
    document.getElementById('modalBody').innerHTML=`
      <h3 style="margin-bottom:12px;">Undo Copy Status?</h3>
      <p style="font-size:13.5px;color:var(--muted);margin-bottom:20px;">Are you sure you want to mark <b>${esc(name)}</b>'s data as <b>not yet copied</b>?</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-ghost" style="color:var(--red);" onclick="confirmDmStatus('${weddingId}','${eventId}','${cat}',${idx},'pending')">Yes, Undo</button>
      </div>`;
  }
  document.getElementById('overlay').classList.add('show');
}
function confirmDmStatus(weddingId, eventId, cat, idx, newStatus){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.dataManagement.events[eventId][cat][idx].status=newStatus;
  closeModal();
  renderTab();
}
// Disk dropdown — shows all previously used disk names, filtered as you type
function renderDiskDropdown(weddingId){
  const box=document.getElementById('diskDropdown_'+weddingId);
  const inp=document.getElementById('newHdInput_'+weddingId);
  if(!box||!inp) return;
  const q=inp.value.trim().toLowerCase();
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const alreadyAdded=w.dataManagement.hardDisks;
  const options=KNOWN_DISKS.filter(d=>!alreadyAdded.includes(d) && d.toLowerCase().includes(q));
  if(!options.length){ box.style.display='none'; return; }
  box.innerHTML=options.map(d=>`<div class="person-dropdown-item" onmousedown="event.preventDefault();selectDisk('${weddingId}','${esc(d)}')">${esc(d)}</div>`).join('');
  box.style.display='block';
}
function selectDisk(weddingId, name){
  const inp=document.getElementById('newHdInput_'+weddingId);
  if(inp) inp.value=name;
  const box=document.getElementById('diskDropdown_'+weddingId);
  if(box) box.style.display='none';
  addHardDisk(weddingId);
}
function duplicateEvent(weddingId, eventId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const ev=w.events.find(e=>e.id===eventId);
  if(!ev) return;
  const newId=genEventId();
  const copy={id:newId, name:ev.name+' (copy)', date:ev.date, venue:ev.venue, still:[...ev.still], cine:[...ev.cine]};
  w.events.push(copy);
  w.videoEditing.fullVideo[newId]=newTrackObj();
  syncDmWithTeam(w, copy);
  dmExpandedEvents.add(newId);
  renderTab();
}
function removeDmPerson(weddingId, eventId, cat, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const entry=w.dataManagement.events[eventId][cat][idx];
  document.getElementById('modalBody').innerHTML = `
    <h3>Remove ${esc(personName(entry.pid))}?</h3>
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:6px;">This removes them from the ${cat==='still'?'Still':'Video'} data tracking for this event${entry.dataSize?` — recorded size (${esc(entry.dataSize)}) will be lost.`:'.'}</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="background:var(--red);" onclick="confirmRemoveDmPerson('${weddingId}','${eventId}','${cat}',${idx})">Remove</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function confirmRemoveDmPerson(weddingId, eventId, cat, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.dataManagement.events[eventId][cat].splice(idx,1);
  closeModal();
  renderTab();
}
function openAddDmPerson(weddingId, eventId, cat){
  document.getElementById('modalBody').innerHTML = `
    <h3>Add Person — ${cat==='still'?'Still':'Video'} Data</h3>
    <div class="field">
      <label>Select Person</label>
      <div style="position:relative;">
        <input id="f_dmPerson" placeholder="Type a name or click to browse..." autocomplete="off"
          oninput="renderDmPersonDropdown('${weddingId}','${eventId}','${cat}')"
          onfocus="renderDmPersonDropdown('${weddingId}','${eventId}','${cat}')"
          onblur="setTimeout(()=>{const d=document.getElementById('dmPersonDropdown'); if(d) d.style.display='none';},150)">
        <div id="dmPersonDropdown" class="person-dropdown"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAddDmPerson('${weddingId}','${eventId}','${cat}')">Add</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function renderDmPersonDropdown(weddingId, eventId, cat){
  const box=document.getElementById('dmPersonDropdown');
  const inp=document.getElementById('f_dmPerson');
  if(!box||!inp) return;
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const already=w.dataManagement.events[eventId][cat].map(e=>e.pid);
  const q=inp.value.trim().toLowerCase();
  const options=getAllPeople().filter(p=>!already.includes(p.id) && p.name.toLowerCase().includes(q));
  box.innerHTML = options.length
    ? options.map(p=>`<div class="person-dropdown-item" onmousedown="event.preventDefault();pickDmPerson('${p.id}')">${esc(p.name)}${p.type==='freelancer'?' <span class="tmeta">(freelancer)</span>':''}</div>`).join('')
    : `<div class="person-dropdown-empty">No match — click Add to create "${esc(inp.value.trim())}" as a new freelancer</div>`;
  box.style.display='block';
}
function pickDmPerson(pid){
  document.getElementById('f_dmPerson').value = personName(pid);
  document.getElementById('dmPersonDropdown').style.display='none';
}
function saveAddDmPerson(weddingId, eventId, cat){
  const typed=document.getElementById('f_dmPerson').value.trim();
  if(!typed){ closeModal(); return; }
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const already=w.dataManagement.events[eventId][cat].map(e=>e.pid);
  let match=getAllPeople().find(p=>!already.includes(p.id) && p.name.toLowerCase()===typed.toLowerCase());
  if(!match){
    // Typed a name nobody recognizes — create a new freelancer on the spot instead of
    // silently doing nothing, same as the event team picker does.
    match={id:genId(), name:typed, type:'freelancer', title:'Freelancer'};
    FREELANCERS.push(match);
  }
  w.dataManagement.events[eventId][cat].push({pid:match.id, status:'pending', dataSize:''});
  closeModal();
  renderTab();
}
function addHardDisk(weddingId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const inp=document.getElementById('newHdInput_'+weddingId);
  const name=inp.value.trim();
  if(!name) return;
  if(!w.dataManagement.hardDisks.includes(name)) w.dataManagement.hardDisks.push(name);
  if(!KNOWN_DISKS.includes(name)) KNOWN_DISKS.push(name);
  inp.value='';
  renderTab();
}
function removeHardDisk(weddingId, idx){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.dataManagement.hardDisks.splice(idx,1);
  renderTab();
}

function deleteWedding(id){
  WEDDINGS=WEDDINGS.filter(x=>x.id!==id);
  currentWeddingId=null;
  renderTab();
}

function emptyState(msg){ return `<div class="empty">${msg}</div>`; }

// ---------- New wedding modal ----------
function openWeddingModal(){
  document.getElementById('modalBody').innerHTML = `
    <h3>New Wedding Booking</h3>
    <div class="field"><label>Client Names</label><input id="f_client" placeholder="e.g. Karan & Simran"></div>
    <div style="font-size:12px;color:var(--muted);margin:6px 0 4px;">A wedding is just a group of events (Mehendi, Sangeet, Wedding, Reception etc.) — add those, with their own dates, after creating it here.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewWedding()">Create Wedding</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function saveNewWedding(){
  const client=document.getElementById('f_client').value.trim();
  if(!client){ alert('Client name is required'); return; }
  const w={
    id:genId(), client, events:[],
    photoEditing:newPhotoEditingObj(),
    videoEditing:newVideoEditingObj([]),
    dataManagement:newDataManagementObj([]),
    tracks:weddingWideTracks()
  };
  WEDDINGS.push(w);
  closeModal();
  currentWeddingId=w.id;
  renderTab();
}
// Used by the inline "Client..." combo box on the schedule/ledger rows — typing an
// existing client's name reuses that wedding; typing a brand-new name creates one right
// there so it shows up under Weddings like any other. No date is set on the wedding
// itself — dates live on its events.
function findOrCreateWeddingByName(name){
  name=(name||'').trim();
  if(!name) return null;
  let w=WEDDINGS.find(x=>x.client.trim().toLowerCase()===name.toLowerCase());
  if(!w){
    w={
      id:genId(), client:name, events:[],
      photoEditing:newPhotoEditingObj(),
      videoEditing:newVideoEditingObj([]),
      dataManagement:newDataManagementObj([]),
      tracks:weddingWideTracks()
    };
    WEDDINGS.push(w);
  }
  return w;
}

// ---------- Event modal (add/edit team) ----------
// Team selection is a type-to-add tag input with a real clickable dropdown (not just
// browser autocomplete-while-typing) — clicking the field opens a list of everyone
// available to pick from; typing narrows it. Picking a name adds them as a chip. Typing a
// name nobody recognizes and pressing Enter creates a new freelancer entry on the spot,
// so it's remembered and suggested next time too.
let evTeamStill=[];
let evTeamCine=[];
function renderTeamPicker(cat){
  const selected = cat==='still' ? evTeamStill : evTeamCine;
  const chips = selected.map(pid=>`
    <span class="chip ${isFreelancer(pid)?'freelancer':''}">${esc(personName(pid))} <span style="cursor:pointer;" onclick="removeTeamPerson('${cat}','${pid}')">&times;</span></span>
  `).join('') || '<span style="color:var(--muted);font-size:12px;">nobody added yet</span>';
  return `
    <div style="margin-bottom:8px;">${chips}</div>
    <div style="position:relative;">
      <input id="f_addPerson_${cat}" placeholder="Type a name or click to browse..." autocomplete="off"
        style="width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--paper-dim);color:var(--ink);"
        oninput="renderPersonDropdown('${cat}')"
        onfocus="renderPersonDropdown('${cat}')"
        onblur="setTimeout(()=>{const d=document.getElementById('personDropdown_${cat}'); if(d) d.style.display='none';},150)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();addTeamPerson('${cat}');}">
      <div id="personDropdown_${cat}" class="person-dropdown"></div>
    </div>
  `;
}
function renderPersonDropdown(cat){
  const box=document.getElementById('personDropdown_'+cat);
  const inp=document.getElementById('f_addPerson_'+cat);
  if(!box||!inp) return;
  const selected = cat==='still' ? evTeamStill : evTeamCine;
  const q=inp.value.trim().toLowerCase();
  const options=getAllPeople().filter(p=>!selected.includes(p.id) && p.name.toLowerCase().includes(q));
  box.innerHTML = options.length
    ? options.map(p=>`<div class="person-dropdown-item" onmousedown="event.preventDefault();selectTeamPerson('${cat}','${p.id}')">${esc(p.name)}${p.type==='freelancer'?' <span class="tmeta">(freelancer)</span>':''}</div>`).join('')
    : `<div class="person-dropdown-empty">No match — press Enter to add "${esc(inp.value.trim())}" as a new freelancer</div>`;
  box.style.display='block';
}
function selectTeamPerson(cat, pid){
  const arr = cat==='still' ? evTeamStill : evTeamCine;
  if(!arr.includes(pid)) arr.push(pid);
  document.getElementById('teamPicker_'+cat).innerHTML = renderTeamPicker(cat);
}
function addTeamPerson(cat){
  const inp=document.getElementById('f_addPerson_'+cat);
  const typed=inp.value.trim();
  if(!typed) return;
  let match=getAllPeople().find(p=>p.name.toLowerCase()===typed.toLowerCase());
  if(!match){
    match={id:genId(), name:typed, type:'freelancer', title:'Freelancer'};
    FREELANCERS.push(match);
  }
  const arr = cat==='still' ? evTeamStill : evTeamCine;
  if(!arr.includes(match.id)) arr.push(match.id);
  document.getElementById('teamPicker_'+cat).innerHTML = renderTeamPicker(cat);
  renderTab(); // refreshes datalists elsewhere with any newly added freelancer
}
function removeTeamPerson(cat, pid){
  const arr = cat==='still' ? evTeamStill : evTeamCine;
  const idx=arr.indexOf(pid);
  if(idx>-1) arr.splice(idx,1);
  document.getElementById('teamPicker_'+cat).innerHTML = renderTeamPicker(cat);
}
function openEventModal(weddingId, eventId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const ev = eventId ? w.events.find(e=>e.id===eventId) : null;
  evTeamStill = ev ? [...ev.still] : [];
  evTeamCine = ev ? [...ev.cine] : [];
  document.getElementById('modalBody').innerHTML = `
    <h3>${ev?'Edit Event':'Add Event'} — ${esc(w.client)}</h3>
    <div class="row2">
      <div class="field"><label>Event Name</label><input id="f_ename" placeholder="e.g. Sangeet" value="${ev?esc(ev.name):''}"></div>
      <div class="field"><label>Date</label><input id="f_edate" type="date" value="${ev?ev.date:''}"></div>
    </div>
    <div class="field"><label>Venue</label><input id="f_evenue" placeholder="e.g. ITC Maurya" value="${ev?esc(ev.venue):''}"></div>
    <div class="field"><label>Still Photography Team</label><div id="teamPicker_still">${renderTeamPicker('still')}</div></div>
    <div class="field"><label>Cinematography Team</label><div id="teamPicker_cine">${renderTeamPicker('cine')}</div></div>
    <div class="modal-actions">
      ${ev?`<button class="btn btn-ghost" style="color:var(--red);" onclick="deleteEvent('${weddingId}','${eventId}')">Delete Event</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEvent('${weddingId}','${eventId||''}')">Save Event</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
}
function saveEvent(weddingId, eventId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  const name=document.getElementById('f_ename').value.trim();
  const date=document.getElementById('f_edate').value;
  const venue=document.getElementById('f_evenue').value.trim();
  const still=[...evTeamStill];
  const cine=[...evTeamCine];
  if(!name||!date){ alert('Event name and date are required'); return; }
  if(eventId){
    const ev=w.events.find(e=>e.id===eventId);
    ev.name=name; ev.date=date; ev.venue=venue; ev.still=still; ev.cine=cine;
    syncDmWithTeam(w, ev);
  } else {
    const newEvId=genEventId();
    w.events.push({id:newEvId, name, date, venue, still, cine});
    w.videoEditing.fullVideo[newEvId]=newTrackObj();
    // dataManagement auto-initializes from event team on first render (see ensureDmInit)
  }
  closeModal();
  renderTab();
}
// Keep Data Management in sync when the team is edited later — adds newly-checked people
// (without touching status/size already recorded for people still on the team) and removes
// anyone who got unchecked from the team, so DM never holds stale/orphaned entries.
function syncDmWithTeam(w, ev){
  ensureDmInit(w, ev);
  const dm=w.dataManagement.events[ev.id];
  ev.still.forEach(pid=>{ if(!dm.still.some(e=>e.pid===pid)) dm.still.push({pid, status:'pending', dataSize:''}); });
  ev.cine.forEach(pid=>{ if(!dm.video.some(e=>e.pid===pid)) dm.video.push({pid, status:'pending', dataSize:''}); });
  dm.still = dm.still.filter(e=>ev.still.includes(e.pid));
  dm.video = dm.video.filter(e=>ev.cine.includes(e.pid));
}
function deleteEvent(weddingId, eventId){
  const w=WEDDINGS.find(x=>x.id===weddingId);
  w.events=w.events.filter(e=>e.id!==eventId);
  delete w.videoEditing.fullVideo[eventId];
  Object.keys(w.dataManagement.events).forEach(k=>{ if(k===eventId) delete w.dataManagement.events[k]; });
  closeModal();
  renderTab();
}

function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click',(ev)=>{ if(ev.target.id==='overlay') closeModal(); });

Object.assign(window,{setTab, openWeddingDetail, closeWeddingDetail, openWeddingModal, saveNewWedding,
  openEventModal, saveEvent, deleteEvent, updateTrack, updatePhotoEditing, deleteWedding, closeModal,
  addHardDisk, removeHardDisk, toggleDmStatus, confirmDmStatus, openDmSizeInput, saveDmSize, removeDmPerson, openAddDmPerson, saveAddDmPerson, handleFab, toggleEventCard, toggleDmEventCard,
  renderDiskDropdown, selectDisk, duplicateEvent,
  logout, loginAs, openStaffModal, saveStaff, deleteStaff, confirmRemoveDmPerson,
  openAssignWorkStaff, closeAssignWorkStaff, setExpandedStage,
  addTeamPerson, removeTeamPerson, renderPersonDropdown, selectTeamPerson,
  renderDmPersonDropdown, pickDmPerson,
  renderHdDropdown, setHdDisk,
  renderAwClientDropdown, renderAwLabelDropdown, submitDirectAssign,
  toggleTaskDone, logExtraWork, updateTaskField, reassignTask, removeTask,
  duplicateTask, openEditTaskModal, saveEditTask, renderEtLabelDropdown,
  WEDDINGS, EMPLOYEES, FREELANCERS, KNOWN_DISKS, TASKS, OWNER, render, attemptLogin, saveOwnerAccount, ensureWeddingTracks, allTracksOf, migrateTasksFromWeddings});

render();
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPibb9xFpSukQY2HwSx4DuNo7UgX6YkQk",
    authDomain: "fv-erm.firebaseapp.com",
    projectId: "fv-erm",
    storageBucket: "fv-erm.firebasestorage.app",
    messagingSenderId: "254486145999",
    appId: "1:254486145999:web:8bf567c3e4211cf0e0c0ba"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  // We split across multiple Firestore docs to avoid the 1MB per-document limit:
  // - fotovision_erm/meta  — staff, freelancers, owner (small, rarely changes)
  // - fotovision_erm/weddings_N — weddings in batches of 5 (can grow without hitting limit)
  const metaRef = doc(db, "fotovision_erm", "meta");
  const WEDDINGS_PER_DOC = 5;
  function weddingDocRef(i){ return doc(db, "fotovision_erm", "weddings_"+i); }

  let saveTimer = null;
  window.fvScheduleSave = function(){
    if(!window.WEDDINGS) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        // Save staff/owner/freelancers to meta doc
        await setDoc(metaRef, {
          employeesJSON: JSON.stringify(window.EMPLOYEES),
          freelancersJSON: JSON.stringify(window.FREELANCERS || []),
          ownerJSON: JSON.stringify(window.OWNER || {}),
          knownDisksJSON: JSON.stringify(window.KNOWN_DISKS || []),
          tasksJSON: JSON.stringify(window.TASKS || []),
          weddingDocCount: Math.ceil(window.WEDDINGS.length / WEDDINGS_PER_DOC) || 1,
          updatedAt: new Date().toISOString()
        });
        // Save weddings in batches of 5 per doc
        const batches = [];
        for(let i=0; i<window.WEDDINGS.length; i+=WEDDINGS_PER_DOC){
          batches.push(window.WEDDINGS.slice(i, i+WEDDINGS_PER_DOC));
        }
        if(batches.length===0) batches.push([]);
        await Promise.all(batches.map((batch,i)=>setDoc(weddingDocRef(i), {weddingsJSON: JSON.stringify(batch)})));
        console.log("Fotovision ERM: saved to Firestore ("+batches.length+" wedding doc(s))");
      } catch(e){
        console.error("Fotovision ERM: save failed", e);
      }
    }, 800);
  };

  (async () => {
    try {
      const metaSnap = await getDoc(metaRef);
      if(metaSnap.exists()){
        const meta = metaSnap.data();
        const employees = JSON.parse(meta.employeesJSON || "[]");
        const freelancers = JSON.parse(meta.freelancersJSON || "[]");
        const knownDisks = JSON.parse(meta.knownDisksJSON || "[]");
        const tasks = JSON.parse(meta.tasksJSON || "[]");
        // Load all wedding batches
        const docCount = meta.weddingDocCount || 1;
        const weddingSnaps = await Promise.all(
          Array.from({length:docCount}, (_,i)=>getDoc(weddingDocRef(i)))
        );
        const weddings = weddingSnaps.flatMap(snap=>
          snap.exists() ? JSON.parse(snap.data().weddingsJSON||"[]") : []
        );
        window.WEDDINGS.length = 0;
        window.WEDDINGS.push(...weddings);
        window.EMPLOYEES.length = 0;
        window.EMPLOYEES.push(...employees);
        window.FREELANCERS.length = 0;
        window.FREELANCERS.push(...freelancers);
        window.KNOWN_DISKS.length = 0;
        window.KNOWN_DISKS.push(...knownDisks);
        window.TASKS.length = 0;
        window.TASKS.push(...tasks);
        // Also seed from existing wedding hardDisks in case any weren't in the registry
        window.WEDDINGS.forEach(w=>(w.dataManagement.hardDisks||[]).forEach(d=>{
          if(!window.KNOWN_DISKS.includes(d)) window.KNOWN_DISKS.push(d);
        }));
        if(window.ensureWeddingTracks) window.WEDDINGS.forEach(w=>window.ensureWeddingTracks(w));
        if(window.allTracksOf) window.WEDDINGS.forEach(w=>window.allTracksOf(w));
        // Migrate any pre-v45 track assignments into TASKS so staff see them on their schedule
        if(window.migrateTasksFromWeddings) window.migrateTasksFromWeddings();
        if(meta.ownerJSON && window.OWNER){
          const ownerData = JSON.parse(meta.ownerJSON);
          if(ownerData.loginId) window.OWNER.loginId = ownerData.loginId;
          if(ownerData.password) window.OWNER.password = ownerData.password;
        }
        console.log("Fotovision ERM: loaded saved data from Firestore ("+weddings.length+" weddings)");
        if(window.render) window.render();
      } else {
        // Try loading from old single-doc format (migration from v38 and earlier)
        const oldRef = doc(db, "fotovision_erm", "state");
        const oldSnap = await getDoc(oldRef);
        if(oldSnap.exists()){
          const data = oldSnap.data();
          const weddings = JSON.parse(data.weddingsJSON || "[]");
          const employees = JSON.parse(data.employeesJSON || "[]");
          const freelancers = JSON.parse(data.freelancersJSON || "[]");
          window.WEDDINGS.length = 0; window.WEDDINGS.push(...weddings);
          window.EMPLOYEES.length = 0; window.EMPLOYEES.push(...employees);
          window.FREELANCERS.length = 0; window.FREELANCERS.push(...freelancers);
          if(window.ensureWeddingTracks) window.WEDDINGS.forEach(w=>window.ensureWeddingTracks(w));
          if(window.allTracksOf) window.WEDDINGS.forEach(w=>window.allTracksOf(w));
          if(data.ownerJSON && window.OWNER){
            const ownerData = JSON.parse(data.ownerJSON);
            if(ownerData.loginId) window.OWNER.loginId = ownerData.loginId;
            if(ownerData.password) window.OWNER.password = ownerData.password;
          }
          console.log("Fotovision ERM: migrated from old single-doc format, re-saving...");
          if(window.migrateTasksFromWeddings) window.migrateTasksFromWeddings();
          if(window.render) window.render();
          // Re-save in new split format immediately so old doc is no longer needed
          window.fvScheduleSave();
        } else {
          // First ever run — seed Firestore with sample data
          window.fvScheduleSave();
        }
      }
    } catch(e){
      console.error("Fotovision ERM: load failed, using local sample data", e);
    }
  })();
</script>
